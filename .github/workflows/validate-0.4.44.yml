name: Validate NavTasks 0.4.44 selective exchange and search
on:
  push:
    branches: [selective-sharing-search-0.4.44]
    paths: ['.github/workflows/validate-0.4.44.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: sdkmanager --install 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Verify version and data schema
        run: |
          set -euo pipefail
          grep -q 'versionName = "0.4.44"' app/build.gradle.kts
          grep -q 'versionCode = 66' app/build.gradle.kts
          grep -q 'navtasks-selective-v1' app/src/main/java/com/navtasks/app/SelectiveTransfer.kt
      - name: Run unit and transfer regression tests
        run: gradle :app:testDebugUnitTest --no-daemon
      - name: Build Android APK and Compose layouts
        run: gradle :app:assembleDebug --no-daemon
