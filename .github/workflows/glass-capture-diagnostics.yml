name: NavTasks Glass Capture Diagnostics - A B C
on:
  push:
    branches: [feature/glass-capture-diagnostics]
    paths:
      - 'app/**'
      - '.github/workflows/glass-capture-diagnostics.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: sdkmanager --install 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Restore Beta signing key for separately installed app
        env:
          KEYSTORE_B64: \${{ secrets.NAVTASKS_BETA_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$GITHUB_WORKSPACE/navtasks-beta-sign.p12"
          test -s "$GITHUB_WORKSPACE/navtasks-beta-sign.p12"
      - name: Confirm isolation and original Lab shader; run regression suite
        env:
          NAVTASKS_BETA_KEYSTORE_PATH: \${{ github.workspace }}/navtasks-beta-sign.p12
          NAVTASKS_BETA_SIGN_PASSWORD: \${{ secrets.NAVTASKS_BETA_SIGN_PASSWORD }}
        run: |
          set -euo pipefail
          grep -Fq 'applicationIdSuffix = ".glassdiagnostic"' app/build.gradle.kts
          grep -Fq 'versionNameSuffix = "-capture-diagnostic1"' app/build.gradle.kts
          grep -Fq 'NavGlassDiagnosticReferenceScene(palette.dark)' app/src/main/java/com/navtasks/app/NavTasksUi.kt
          grep -Fq 'NavGlassDiagnosticModes.LIVE_HAZE' app/src/main/java/com/navtasks/app/NavTasksUi.kt
          test "$(git hash-object app/src/main/java/com/navtasks/app/NavLiquidGlassDock.kt)" = "77079f53d7f86ea736c8acbb5e2d326d7ad34525"
          test "$(git hash-object app/src/main/java/com/navtasks/app/NavLiquidDockOptics.kt)" = "b63f59048d3798f04f4b722c5e862de4814a42ec"
          gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon
      - name: Remove temporary key
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/navtasks-beta-sign.p12"
      - name: Verify package ID and pack signed APK as a compact ZIP
        run: |
          set -euo pipefail
          APK=NavTasks_Glass_Capture_Diagnostics_0.4.60.apk
          ZIP=NavTasks_Glass_Capture_Diagnostics_0.4.60.zip
          test -s app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | grep -F "package: name='com.navtasks.app.glassdiagnostic'"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          zip -9 -X "$ZIP" "$APK"
          unzip -t "$ZIP"
          test "$(sha256sum "$APK" | cut -d ' ' -f 1)" = "$(unzip -p "$ZIP" "$APK" | sha256sum | cut -d ' ' -f 1)"
          echo "APK bytes: $(stat -c %s "$APK")"
          echo "ZIP bytes: $(stat -c %s "$ZIP")"
          sha256sum "$ZIP"
      - uses: actions/upload-artifact@v4
        with:
          name: NavTasks-Glass-Capture-Diagnostics-ZIP
          path: NavTasks_Glass_Capture_Diagnostics_0.4.60.zip
          if-no-files-found: error
          retention-days: 60
      - name: Publish diagnostic prerelease
        env:
          GH_TOKEN: \${{ github.token }}
        run: |
          set -euo pipefail
          TAG=glasscapture-v0.4.60-diagnostic1
          ZIP=NavTasks_Glass_Capture_Diagnostics_0.4.60.zip
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" --clobber
          else
            gh release create "$TAG" "$ZIP" --target "$GITHUB_SHA" \
              --title "NavTasks Glass - controlled capture diagnosis" \
              --notes "SEPARATE TEST APP com.navtasks.app.glassdiagnostic. Never uninstall existing NavTasks. Three capture modes: ЭКРАН = real UI with Haze; БЕЗ HAZE = same UI without Haze source; ЭТАЛОН = color cards from Glass Lab 0.1.5. Glass shader and lens remain identical to approved Lab. Switch modes and scroll cards under dock in dark and light themes. Report screenshots. ZIP contains signed APK; unzip then install." \
              --prerelease
          fi
