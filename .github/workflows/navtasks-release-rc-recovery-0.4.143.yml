name: NavTasks 0.4.143 Beta — signed exact 0.4.140 source recovery (private)

on:
  push:
    branches:
      - feature/navtasks-0.4.143-release-rc-recovery
    paths:
      - 'app/**'
      - '.github/workflows/navtasks-release-rc-recovery-0.4.143.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recovery-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install SDK
        run: sdkmanager --install 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'
      - name: Restore EXISTING signing key only
        env:
          KEYSTORE_B64: ${{ secrets.NAVTASKS_BETA_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$GITHUB_WORKSPACE/navtasks-beta-sign.p12"
          chmod 600 "$GITHUB_WORKSPACE/navtasks-beta-sign.p12"
          test -s "$GITHUB_WORKSPACE/navtasks-beta-sign.p12"
      - name: Assert original 0.4.140 application code unchanged
        run: |
          set -euo pipefail
          grep -Fq 'versionCode = 168' app/build.gradle.kts
          grep -Fq 'versionName = "0.4.143"' app/build.gradle.kts
          grep -Fq 'applicationIdSuffix = ".glass"' app/build.gradle.kts
          test "$(git hash-object app/src/main/AndroidManifest.xml)" = 'c1036f8f4546e4e6a042756071c855740ff43100'
          test "$(git hash-object app/src/main/java/com/navtasks/app/ProfileStore.kt)" = '6a522893024d0043470fc0ac8b7979faa8e81a95'
          test "$(git hash-object app/src/main/java/com/navtasks/app/TaskStore.kt)" = 'c5ab3d8aebae8744dba835d21961a6a100287200'
          test "$(git hash-object app/src/main/java/com/navtasks/app/HandoverStore.kt)" = '0143b677826c7cfab3dcf1b6ffb4a1c0e2e214cb'
          test "$(git hash-object app/src/main/java/com/navtasks/app/ServiceStore.kt)" = '9302d73141adb644f0ec8fe7210c010da7aae376'
          test "$(git hash-object app/src/main/java/com/navtasks/app/WorkOrderStore.kt)" = 'e721fd57a42403fefe4fca6d6c325a9c2a8acd46'
          test "$(git hash-object app/src/main/java/com/navtasks/app/NavLiquidDockOptics.kt)" = 'b63f59048d3798f04f4b722c5e862de4814a42ec'
      - name: Build and test exact legacy app in-place fallback
        env:
          NAVTASKS_BETA_KEYSTORE_PATH: ${{ github.workspace }}/navtasks-beta-sign.p12
          NAVTASKS_BETA_SIGN_PASSWORD: ${{ secrets.NAVTASKS_BETA_SIGN_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$NAVTASKS_BETA_SIGN_PASSWORD"
          gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon
      - name: Verify compatible package, signature and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          SIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$AAPT" dump badging "$APK" | grep -F "package: name='com.navtasks.app.glass' versionCode='168' versionName='0.4.143-beta'"
          "$SIGNER" verify --min-sdk-version 31 "$APK"
          mkdir -p "$RUNNER_TEMP/baseline"
          gh release download v0.4.140-personal-search-fix-verified --repo "$GITHUB_REPOSITORY" \
            --pattern NavTasks_Personal_Search_Fix_0.4.140_Beta_Update.zip --dir "$RUNNER_TEMP/baseline"
          ZIP="$RUNNER_TEMP/baseline/NavTasks_Personal_Search_Fix_0.4.140_Beta_Update.zip"
          ENTRY="$(unzip -Z1 "$ZIP" | grep -E '\.apk$')"
          test "$(printf '%s\n' "$ENTRY" | wc -l)" -eq 1
          unzip -p "$ZIP" "$ENTRY" > "$RUNNER_TEMP/baseline/old.apk"
          "$SIGNER" verify --min-sdk-version 31 "$RUNNER_TEMP/baseline/old.apk"
          fingerprint() {
            "$SIGNER" verify --print-certs "$1" | awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {print $2; exit}'
          }
          OLD="$(fingerprint "$RUNNER_TEMP/baseline/old.apk")"
          NEW="$(fingerprint "$APK")"
          test -n "$OLD"
          test "$OLD" = "$NEW"
          mkdir -p dist
          cp "$APK" dist/NavTasks_0.4.143_Beta_Exact_0.4.140_Recovery.apk
          (cd dist && sha256sum NavTasks_0.4.143_Beta_Exact_0.4.140_Recovery.apk > NavTasks_0.4.143_Beta_Exact_0.4.140_Recovery.apk.sha256)
          (cd dist && sha256sum -c NavTasks_0.4.143_Beta_Exact_0.4.140_Recovery.apk.sha256)
      - name: Erase temporary key
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/navtasks-beta-sign.p12"
      - name: Publish private DRAFT recovery (not stable)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=v0.4.143-exact-0.4.140-recovery-private
          SOURCE="$(gh api "repos/$GITHUB_REPOSITORY/branches/feature/navtasks-0.4.143-release-rc-recovery" --jq '.commit.sha')"
          if [ "$SOURCE" != "$GITHUB_SHA" ]; then
            echo "::error::Superseded recovery cannot publish"
            exit 1
          fi
          test -s dist/NavTasks_0.4.143_Beta_Exact_0.4.140_Recovery.apk
          test -s dist/NavTasks_0.4.143_Beta_Exact_0.4.140_Recovery.apk.sha256
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Private draft already exists; not replacing"
          else
            gh release create "$TAG" \
              dist/NavTasks_0.4.143_Beta_Exact_0.4.140_Recovery.apk \
              dist/NavTasks_0.4.143_Beta_Exact_0.4.140_Recovery.apk.sha256 \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "NavTasks 0.4.143 · private exact 0.4.140 rollback ONLY" \
              --notes "PRIVATE DRAFT / PRERELEASE. This APK contains EXACT earlier 0.4.140 application sources, with Gradle version bumped to code168 so it can be installed ON TOP of 0.4.142-rc1/code167 if that candidate fails. It is NOT a new functional upgrade or a stable release. Export FULL profiles first; NEVER uninstall or clear data. Next version after code168 must be at least 169." \
              --draft --prerelease
          fi
