name: Publish NavTasks Glass 0.4.53 APK
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-0.4.53-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out verified 0.4.53 minimal month calendar source
        uses: actions/checkout@v4
        with:
          ref: 81cce3e29b74454f6329a124f9589570a9cb2722
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: sdkmanager --install 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Restore stable beta signing key
        env:
          KEYSTORE_B64: ${{ secrets.NAVTASKS_BETA_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$GITHUB_WORKSPACE/navtasks-beta-sign.p12"
          test -s "$GITHUB_WORKSPACE/navtasks-beta-sign.p12"
      - name: Verify source and run regression tests
        env:
          NAVTASKS_BETA_KEYSTORE_PATH: ${{ github.workspace }}/navtasks-beta-sign.p12
          NAVTASKS_BETA_SIGN_PASSWORD: ${{ secrets.NAVTASKS_BETA_SIGN_PASSWORD }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "81cce3e29b74454f6329a124f9589570a9cb2722"
          grep -q 'versionName = "0.4.53"' app/build.gradle.kts
          grep -q 'versionCode = 75' app/build.gradle.kts
          if grep -Fq 'Column(Modifier.fillMaxSize().statusBarsPadding().navigationBarsPadding()' \
              app/src/main/java/com/navtasks/app/ServicesUi.kt \
              app/src/main/java/com/navtasks/app/WorkOrdersUi.kt; then
            echo "::error::Standalone work pages must be edge-to-edge"
            exit 1
          fi
          if grep -Fq '.border(if (isToday) 2.dp else 1.dp' app/src/main/java/com/navtasks/app/PlanAndTasksUi.kt; then
            echo "::error::Bright month-cell borders regressed"
            exit 1
          fi
          if grep -Eq '<Space([[:space:]]|>)' app/src/main/res/layout/navtasks_widget_*.xml; then
            echo "::error::Unsupported Space in RemoteViews layout"
            exit 1
          fi
          gradle :app:testDebugUnitTest --no-daemon
      - name: Build stable-signed debug APK
        env:
          NAVTASKS_BETA_KEYSTORE_PATH: ${{ github.workspace }}/navtasks-beta-sign.p12
          NAVTASKS_BETA_SIGN_PASSWORD: ${{ secrets.NAVTASKS_BETA_SIGN_PASSWORD }}
        run: gradle :app:assembleDebug --no-daemon
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/navtasks-beta-sign.p12"
      - name: Package compact ZIP directly from build
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          mkdir -p upload
          cp app/build/outputs/apk/debug/app-debug.apk upload/NavTasks_Glass_0.4.53_Beta.apk
          sha256sum upload/NavTasks_Glass_0.4.53_Beta.apk
          cd upload
          zip -q NavTasks_Glass_0.4.53_Build.zip NavTasks_Glass_0.4.53_Beta.apk
          unzip -t NavTasks_Glass_0.4.53_Build.zip
          cd ..
      - name: Publish 0.4.53 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v0.4.53-glass-beta \
            upload/NavTasks_Glass_0.4.53_Beta.apk \
            upload/NavTasks_Glass_0.4.53_Build.zip \
            --repo "${{ github.repository }}" \
            --target 81cce3e29b74454f6329a124f9589570a9cb2722 \
            --prerelease \
            --title "NavTasks Glass 0.4.53 Beta · Calm Monthly Calendar" \
            --notes "NavTasks 0.4.53: simplified Plan month calendar in both themes. Removed bright blue day-cell borders, replaced them with gentle status-aware surfaces; Saturdays and Sundays now use restrained coral numerals and weekday headers. Date numerals are 16sp, fixed at the exact center independently of status dots anchored at the bottom of each cell. Today remains subtly blue-highlighted. Existing completion/missed dot meanings, calendar swipe, tasks, AMOS, Services, profiles, notifications, widgets and stored data are unchanged. Immutable source pinned to 81cce3e29b74454f6329a124f9589570a9cb2722. Unit tests and stable-signed release build run in this workflow; HONOR visual validation remains outstanding."
