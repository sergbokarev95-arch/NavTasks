name: Publish NavTasks Glass 0.4.42 APK
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-0.4.42-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out verified 0.4.42 Tasks always-visible source
        uses: actions/checkout@v4
        with:
          ref: c24db0ed60b741e08ec51f019b862d6d20bdf5f8
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: sdkmanager --install 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Restore stable beta signing key
        env:
          KEYSTORE_B64: ${{ secrets.NAVTASKS_BETA_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$GITHUB_WORKSPACE/navtasks-beta-sign.p12"
          test -s "$GITHUB_WORKSPACE/navtasks-beta-sign.p12"
      - name: Verify source and run regression tests
        env:
          NAVTASKS_BETA_KEYSTORE_PATH: ${{ github.workspace }}/navtasks-beta-sign.p12
          NAVTASKS_BETA_SIGN_PASSWORD: ${{ secrets.NAVTASKS_BETA_SIGN_PASSWORD }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "c24db0ed60b741e08ec51f019b862d6d20bdf5f8"
          grep -q 'versionName = "0.4.42"' app/build.gradle.kts
          grep -q 'versionCode = 64' app/build.gradle.kts
          gradle :app:testDebugUnitTest --no-daemon
      - name: Build stable-signed debug APK
        env:
          NAVTASKS_BETA_KEYSTORE_PATH: ${{ github.workspace }}/navtasks-beta-sign.p12
          NAVTASKS_BETA_SIGN_PASSWORD: ${{ secrets.NAVTASKS_BETA_SIGN_PASSWORD }}
        run: gradle :app:assembleDebug --no-daemon
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/navtasks-beta-sign.p12"
      - name: Package compact ZIP directly from build
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          mkdir -p upload
          cp app/build/outputs/apk/debug/app-debug.apk upload/NavTasks_Glass_0.4.42_Beta.apk
          sha256sum upload/NavTasks_Glass_0.4.42_Beta.apk
          cd upload
          zip -q NavTasks_Glass_0.4.42_Build.zip NavTasks_Glass_0.4.42_Beta.apk
          unzip -t NavTasks_Glass_0.4.42_Build.zip
          cd ..
      - name: Publish 0.4.42 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v0.4.42-glass-beta \
            upload/NavTasks_Glass_0.4.42_Beta.apk \
            upload/NavTasks_Glass_0.4.42_Build.zip \
            --repo "${{ github.repository }}" \
            --target c24db0ed60b741e08ec51f019b862d6d20bdf5f8 \
            --prerelease \
            --title "NavTasks Glass 0.4.42 Beta · Always-visible Tasks" \
            --notes "NavTasks 0.4.42: The Tasks tab now shows all task templates immediately within the selected Daily, Weekly, Monthly or One-off category, without an extra reveal gesture. The Task list panel is a compact read-only information header with task count, no chevron, no stack stripes and no collapse interaction. Existing LazyColumn cards, stable item IDs, scrolling, tapping a task to edit, frequency filtering, task scheduling, history, data storage, import/export, AMOS, Services, Handover, Today and glass dock are unchanged. This release updates only PlanAndTasksUi.kt and app version (versionCode 64). Verified in branch CI 42178533541 and signed main CI 42179014975 and retested in this publish job. Physical device verification is still needed."
