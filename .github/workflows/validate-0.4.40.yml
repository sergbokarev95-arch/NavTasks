name: Validate NavTasks 0.4.40 AMOS fixes
# Re-run after Compose import verification.
on:
  push:
    branches: [fix-amos-agenda-filters-0.4.40]
    paths: ['.github/workflows/validate-0.4.40.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: sdkmanager --install 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Run regression tests
        run: |
          set -euo pipefail
          grep -q 'versionName = "0.4.40"' app/build.gradle.kts
          gradle :app:testDebugUnitTest --no-daemon
      - name: Build APK and verify Kotlin/Compose
        run: gradle :app:assembleDebug --no-daemon
