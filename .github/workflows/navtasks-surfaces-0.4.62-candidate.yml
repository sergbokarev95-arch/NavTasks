name: Signed NavTasks Liquid Glass Surfaces 0.4.62 Beta candidate
on:
  push:
    branches: [feature/liquid-glass-surfaces-0.4.62-beta]
    paths:
      - 'app/**'
      - '.github/workflows/navtasks-surfaces-0.4.62-candidate.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install SDK
        run: sdkmanager --install 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Restore exact installed Beta signing key
        env:
          KEYSTORE_B64: ${{ secrets.NAVTASKS_BETA_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$GITHUB_WORKSPACE/navtasks-beta-sign.p12"
          test -s "$GITHUB_WORKSPACE/navtasks-beta-sign.p12"
      - name: Verify update ID, preview parity, and run full app tests
        env:
          NAVTASKS_BETA_KEYSTORE_PATH: ${{ github.workspace }}/navtasks-beta-sign.p12
          NAVTASKS_BETA_SIGN_PASSWORD: ${{ secrets.NAVTASKS_BETA_SIGN_PASSWORD }}
        run: |
          set -euo pipefail
          grep -Fq 'applicationIdSuffix = ".glass"' app/build.gradle.kts
          grep -Fq 'versionNameSuffix = "-beta"' app/build.gradle.kts
          grep -Fq 'versionCode = 85' app/build.gradle.kts
          grep -Fq 'versionName = "0.4.62"' app/build.gradle.kts
          test "$(git hash-object app/src/main/java/com/navtasks/app/NavTasksUi.kt)" = '7ff7ff4faf0a288787dce7397f3469269054c16a'
          test "$(git hash-object app/src/main/java/com/navtasks/app/NavLiquidGlassDock.kt)" = '53e713f4272f7be6db75e3cfdb65b22d5f55b702'
          test "$(git hash-object app/src/main/java/com/navtasks/app/NavSolidCardTokens.kt)" = 'ee7c0f4388164d05490f89a2e63ae461fc9dfbf8'
          test "$(git hash-object app/src/main/java/com/navtasks/app/NavGlass.kt)" = 'e3ac00c1f555205bce0f8b59b6faf2c817ffe034'
          test "$(git hash-object app/src/main/java/com/navtasks/app/NavLiquidDockOptics.kt)" = 'b63f59048d3798f04f4b722c5e862de4814a42ec'
          gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon
      - name: Remove signing key material
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/navtasks-beta-sign.p12"
      - name: Check signed update package and compress to ZIP
        run: |
          set -euo pipefail
          APK=NavTasks_LiquidGlass_0.4.62_Beta.apk
          ZIP=NavTasks_LiquidGlass_0.4.62_Beta_Update.zip
          test -s app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | grep -F "package: name='com.navtasks.app.glass' versionCode='85' versionName='0.4.62-beta'"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          zip -9 -X "$ZIP" "$APK"
          unzip -t "$ZIP"
          test "$(sha256sum "$APK" | cut -d ' ' -f 1)" = "$(unzip -p "$ZIP" "$APK" | sha256sum | cut -d ' ' -f 1)"
          echo "ZIP bytes: $(stat -c %s "$ZIP")"
          sha256sum "$ZIP"
      # Publish directly to GitHub Releases: Actions artifact quota is full.
      - name: Publish separate candidate update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=v0.4.62-liquid-glass-surfaces-candidate
          ZIP=NavTasks_LiquidGlass_0.4.62_Beta_Update.zip
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" --clobber
          else
            gh release create "$TAG" "$ZIP" --target "$GITHUB_SHA" \
              --title "NavTasks 0.4.62 Beta Candidate - Liquid Glass Surfaces" \
              --notes "IN-PLACE BETA UPDATE CANDIDATE with same signed package com.navtasks.app.glass and versionCode85. BEFORE INSTALLING export a complete profile backup; NEVER uninstall the existing NavTasks. User-approved opaque PANEL/TASK/NESTED_TASK/CONTROL gradients, original direct-Backdrop Liquid Glass, Night selected capsule dark graphite 0xFF3F4B58 alpha .82, dock moved down 4dp, existing 56dp geometry and animations. No change to business logic/profile storage/AMOS/Services/widgets. Signed ZIP contains APK, install over 0.4.60 (or 0.4.61). Not merged into stable main; physical HONOR review still required. Keep ready signed higher-code Haze rollback before upgrading." \
              --prerelease
          fi
