name: Build standalone NavTasks Liquid Glass Lab

on:
  push:
    branches:
      - experiments/liquid-glass-backdrop
    paths:
      - 'glasslab/**'
      - 'settings.gradle.kts'
      - '.github/workflows/glass-lab.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: sdkmanager --install 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Restore stable Beta signing key
        env:
          KEYSTORE_B64: ${{ secrets.NAVTASKS_BETA_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$GITHUB_WORKSPACE/navtasks-beta-sign.p12"
          test -s "$GITHUB_WORKSPACE/navtasks-beta-sign.p12"
      - name: Verify isolation and build lab
        env:
          NAVTASKS_BETA_KEYSTORE_PATH: ${{ github.workspace }}/navtasks-beta-sign.p12
          NAVTASKS_BETA_SIGN_PASSWORD: ${{ secrets.NAVTASKS_BETA_SIGN_PASSWORD }}
        run: |
          set -euo pipefail
          grep -Fq 'applicationId = "com.navtasks.glasslab"' glasslab/build.gradle.kts
          grep -Fq 'implementation("io.github.kyant0:backdrop:1.0.6")' glasslab/build.gradle.kts
          grep -Fq 'implementation("io.github.kyant0:shapes:1.2.0")' glasslab/build.gradle.kts
          grep -Fq 'include(":app")' settings.gradle.kts
          grep -Fq 'versionName = "0.4.59"' app/build.gradle.kts
          grep -Fq 'versionCode = 81' app/build.gradle.kts
          grep -Fq 'versionName = "0.1.5"' glasslab/build.gradle.kts
          grep -Fq 'versionCode = 6' glasslab/build.gradle.kts
          # Parent must not host the Backdrop clip: tall lens is a sibling.
          grep -Fq 'BoxWithConstraints(modifier.fillMaxWidth().height(56.dp)) {' glasslab/src/main/java/com/navtasks/glasslab/GlassLabActivity.kt
          grep -Fq 'Box(Modifier.matchParentSize().then(backing).then(opticalEdge))' glasslab/src/main/java/com/navtasks/glasslab/GlassLabActivity.kt
          if grep -Fq 'BoxWithConstraints(modifier.fillMaxWidth().height(56.dp).then(backing)' glasslab/src/main/java/com/navtasks/glasslab/GlassLabActivity.kt; then
            echo "Clipped parent regression: glass material must be a sibling of moving lens"
            exit 1
          fi
          gradle :glasslab:testDebugUnitTest :glasslab:assembleDebug --no-daemon
      - name: Destroy temporary signing key
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/navtasks-beta-sign.p12"
      - name: Verify generated lab APK
        run: |
          set -euo pipefail
          test -s glasslab/build/outputs/apk/debug/glasslab-debug.apk
          cp glasslab/build/outputs/apk/debug/glasslab-debug.apk NavTasks_LiquidGlass_Lab_0.1.5.apk
          sha256sum NavTasks_LiquidGlass_Lab_0.1.5.apk
      - uses: actions/upload-artifact@v4
        with:
          name: NavTasks-LiquidGlass-Lab-0.1.5
          path: NavTasks_LiquidGlass_Lab_0.1.5.apk
          if-no-files-found: error
          retention-days: 60
      - name: Publish separate prerelease (not production)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="glasslab-v0.1.5"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" NavTasks_LiquidGlass_Lab_0.1.5.apk --clobber
          else
            gh release create "$TAG" NavTasks_LiquidGlass_Lab_0.1.5.apk \
              --target "$GITHUB_SHA" \
              --title "NavTasks Liquid Glass Lab 0.1.5 (standalone experiment)" \
              --notes "SEPARATE TEST APP, package com.navtasks.glasslab. This is NOT a NavTasks update and cannot access or alter profiles, data, notifications or AMOS. Uses Apache-2.0 Backdrop 1.0.6 with separately captured scene content. Preserves v0.1.1 card-border refraction and adds pixel-exact production NavTasks vector dock glyphs/colors. Active lens scales uniformly by 1.30x in X/Y and now renders OUTSIDE the 56dp bar: separate backing sibling fixes the clipping seen on HONOR in Lab 0.1.4. Resting grey selection, icons and proven Backdrop refraction remain. HONOR retest required. Glass OFF is the existing matte control. Toggle glass on/off and Day/Night; scroll cards under the 56dp dock and rapidly switch tabs. Physical HONOR visual/performance acceptance pending. Do not judge glass only on a flat black background." \
              --prerelease
          fi
