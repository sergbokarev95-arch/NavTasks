name: NavTasks 1.2.0 beta.11 Dock direct-drag coral original-key prerelease
on:
  push:
    branches:
      - feature/navtasks-1.2.0-beta11-dock-drag-coral
    paths:
      - 'app/**'
      - '.github/workflows/navtasks-1.2.0-beta11-dock-drag-coral.yml'
  workflow_dispatch:

concurrency:
  group: navtasks-1.2.0-beta11-dock-drag-coral
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  beta-verified:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: sdkmanager --install 'platforms;android-36' 'platforms;android-36-ext19' 'build-tools;35.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Restore EXISTING original signing certificate
        env:
          KEYSTORE_B64: ${{ secrets.NAVTASKS_BETA_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$GITHUB_WORKSPACE/navtasks-beta-sign.p12"
          chmod 600 "$GITHUB_WORKSPACE/navtasks-beta-sign.p12"
          test -s "$GITHUB_WORKSPACE/navtasks-beta-sign.p12"
      - name: Run complete JVM tests and build beta APK
        env:
          NAVTASKS_BETA_KEYSTORE_PATH: ${{ github.workspace }}/navtasks-beta-sign.p12
          NAVTASKS_BETA_SIGN_PASSWORD: ${{ secrets.NAVTASKS_BETA_SIGN_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$NAVTASKS_BETA_SIGN_PASSWORD"
          gradle :app:testDebugUnitTest :app:assembleRelease --no-daemon
      - name: Verify package, release version, non-debuggable and original signer
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.navtasks.app.glass' versionCode='250' versionName='1.2.0-beta.11'"
          ! "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -Fq 'application-debuggable'
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --min-sdk-version 31 "$APK"
          ACTUAL="$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {print $2; exit}')"
          test "$ACTUAL" = 0cb8a3c691e3fb2198682dff8c226aec710e77c7b8fded7d260a92f359a49c54
          sha256sum "$APK"
      - name: Publish signed beta11 SOURCE ONLY prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test ! -z "$GITHUB_SHA"
          LATEST_SHA="$(gh api "repos/$GITHUB_REPOSITORY/branches/feature%2Fnavtasks-1.2.0-beta11-dock-drag-coral" --jq '.commit.sha')"
          test "$LATEST_SHA" = "$GITHUB_SHA" || {
            echo "Branch has changed since this runner started: refusing stale stable release publication."
            exit 1
          }
          if gh release view v1.2.0-beta.11 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v1.2.0-beta.11 already exists; will not overwrite immutable stable release."
            exit 1
          fi
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/NavTasks_1.2.0-beta.11.apk"
          gh release create v1.2.0-beta.11 "$RUNNER_TEMP/NavTasks_1.2.0-beta.11.apk" \
            --repo "$GITHUB_REPOSITORY" --prerelease --latest=false \
            --target "$GITHUB_SHA" --title "NavTasks 1.2.0-beta.11" \
            --notes "Opt-in beta11 dock refinement from HONOR Calendar video: active dock icons and labels use warm coral #FF5C32 rather than blue, inactive glyphs neutral gray. Ordinary taps immediately navigate and the existing single Liquid Glass lens springs to the selected tab. Horizontal drag beginning on the selected lens now follows the finger in real time, previews neighboring icons with continuous tint and light haptics, then navigates exactly once on finger release to the nearest tab (cancel never navigates). No hold-to-enlarge or intermediate page swaps. Existing 56dp dock, original approved refractive material, dock labels and four-tab logic unchanged. Previous beta10 white-card theme, task data and all scheduling unchanged. Signed source-only prerelease, public stable OTA remains 1.1.0."
      - name: Erase temporary signing key
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/navtasks-beta-sign.p12"
