name: Publish NavTasks Glass 0.4.38 APK
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-0.4.38-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out verified 0.4.38 source
        uses: actions/checkout@v4
        with:
          ref: df35f506fb1c7691e2f91c2da74c02ed3256b7e1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: sdkmanager --install 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Restore stable beta signing key
        env:
          KEYSTORE_B64: ${{ secrets.NAVTASKS_BETA_KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$GITHUB_WORKSPACE/navtasks-beta-sign.p12"
          test -s "$GITHUB_WORKSPACE/navtasks-beta-sign.p12"
      - name: Verify 0.4.38 source and run tests
        env:
          NAVTASKS_BETA_KEYSTORE_PATH: ${{ github.workspace }}/navtasks-beta-sign.p12
          NAVTASKS_BETA_SIGN_PASSWORD: ${{ secrets.NAVTASKS_BETA_SIGN_PASSWORD }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "df35f506fb1c7691e2f91c2da74c02ed3256b7e1"
          grep -q 'versionName = "0.4.38"' app/build.gradle.kts
          grep -q 'versionCode = 60' app/build.gradle.kts
          gradle :app:testDebugUnitTest --no-daemon
      - name: Build the same signed beta APK
        env:
          NAVTASKS_BETA_KEYSTORE_PATH: ${{ github.workspace }}/navtasks-beta-sign.p12
          NAVTASKS_BETA_SIGN_PASSWORD: ${{ secrets.NAVTASKS_BETA_SIGN_PASSWORD }}
        run: gradle :app:assembleDebug --no-daemon
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/navtasks-beta-sign.p12"
      - name: Package APK and compact ZIP without artifact egress
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          mkdir -p upload
          cp app/build/outputs/apk/debug/app-debug.apk upload/NavTasks_Glass_0.4.38_Beta.apk
          sha256sum upload/NavTasks_Glass_0.4.38_Beta.apk
          cd upload
          zip -q NavTasks_Glass_0.4.38_Build.zip NavTasks_Glass_0.4.38_Beta.apk
          unzip -t NavTasks_Glass_0.4.38_Build.zip
          cd ..
      - name: Publish version 0.4.38
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v0.4.38-glass-beta \
            upload/NavTasks_Glass_0.4.38_Beta.apk \
            upload/NavTasks_Glass_0.4.38_Build.zip \
            --repo "${{ github.repository }}" \
            --target df35f506fb1c7691e2f91c2da74c02ed3256b7e1 \
            --prerelease \
            --title "NavTasks Glass 0.4.38 Beta · Handover Polish" \
            --notes "Handover now uses a compact, smoothly animated one-section accordion with rotating chevrons and vector edit/add controls. Existing entries, completion marks, dates, notes, profile export and import are unchanged. versionCode 60, versionName 0.4.38. Source commit df35f506fb1c7691e2f91c2da74c02ed3256b7e1 was previously tested in Actions run 42072964783 and is rebuilt and retested directly in this release job to avoid the GitHub artifact egress error. Device validation remains required."
