name: Publish NavTasks Glass 0.4.38 APK
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-0.4.38-apk.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify tested source and download signed APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN=42072964783
          REPO="${{ github.repository }}"
          EXPECTED_SHA="df35f506fb1c7691e2f91c2da74c02ed3256b7e1"
          test "$(gh run view "$RUN" --repo "$REPO" --json conclusion --jq .conclusion)" = success
          test "$(gh run view "$RUN" --repo "$REPO" --json headSha --jq .headSha)" = "$EXPECTED_SHA"
          mkdir -p upload
          gh run download "$RUN" --repo "$REPO" \
            --name NavTasks-Glass-0.2.6-debug-apk --dir upload
          test -s upload/app-debug.apk
          sha256sum upload/app-debug.apk
          mv upload/app-debug.apk upload/NavTasks_Glass_0.4.38_Beta.apk
          cd upload
          zip -q NavTasks_Glass_0.4.38_Build.zip NavTasks_Glass_0.4.38_Beta.apk
          unzip -t NavTasks_Glass_0.4.38_Build.zip
          cd ..

      - name: Publish version 0.4.38
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v0.4.38-glass-beta \
            upload/NavTasks_Glass_0.4.38_Beta.apk \
            upload/NavTasks_Glass_0.4.38_Build.zip \
            --repo "${{ github.repository }}" \
            --target df35f506fb1c7691e2f91c2da74c02ed3256b7e1 \
            --prerelease \
            --title "NavTasks Glass 0.4.38 Beta · Handover Polish" \
            --notes "Handover now uses an animated single-section accordion. Initially collapsed sections expand/collapse smoothly, retaining current section when possible. Added rotating chevron and vector edit/add controls with enlarged touch targets. Data, completion marks, dates, notes, exports and imports remain untouched. versionCode 60, versionName 0.4.38. Unit tests, signed APK build and artifact upload passed in GitHub Actions run 42072964783. On-device testing is still required."
