name: NavTasks 0.4.160 RC15 — opt-in automatic TEST offer verification PRIVATE

on:
  push:
    branches:
      - feature/navtasks-release-qa-auto-offer-0.4.160-rc15
    paths:
      - 'app/**'
      - 'docs/development/UPDATER_AUTO_OFFER_RC15.md'
      - '.github/workflows/navtasks-release-qa-auto-offer-0.4.160.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  signed-qa-rc:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: sdkmanager --install 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Enforce precise updater-only diff and package identity
        shell: bash
        run: |
          set -euo pipefail
          BASE=77387fb9f819c57e5291aaeed0c3972f2d67e88f
          git diff --name-only "$BASE" "$GITHUB_SHA" > changed.txt
          if grep -Ev '^(app/src/main/java/com/navtasks/app/(NavSettings|MainActivity|NavUpdateChecker|NavUpdateOffer|NavTestUpdateFeed|PlanAndTasksUi|NavUpdateQa)\.kt|app/src/test/java/com/navtasks/app/(NavUpdatePreferencesPolicyTest|NavTestUpdateFeedTest|NavTestFeedNetworkPolicyTest|NavAutomaticOfferQaTest)\.kt|app/build\.gradle\.kts|\.github/workflows/navtasks-release-qa-auto-offer-0\.4\.160\.yml|docs/development/UPDATER_AUTO_OFFER_RC15\.md)$' changed.txt; then
            echo "::error::Business/Glass/store source changed outside updater-only scope"
            exit 1
          fi
          grep -Fq 'versionCode = 182' app/build.gradle.kts
          grep -Fq 'versionName = "0.4.160"' app/build.gradle.kts
          grep -Fq 'versionNameSuffix = "-rc15"' app/build.gradle.kts
          grep -Fq 'applicationIdSuffix = ".glass"' app/build.gradle.kts
          grep -Fq 'isDebuggable = false' app/build.gradle.kts
          grep -Fq 'qa_auto_test_offers' app/src/main/java/com/navtasks/app/NavSettings.kt
          grep -Fq 'NavUpdateChecker.checkTestAutomatically(applicationContext)' app/src/main/java/com/navtasks/app/MainActivity.kt
          grep -Fq 'NavUpdateChecker.deferTest(context, update.versionCode)' app/src/main/java/com/navtasks/app/NavUpdateOffer.kt
          grep -Fq 'NavTestFeedNetwork.read()' app/src/main/java/com/navtasks/app/NavUpdateChecker.kt
          grep -Fq 'if (NavUpdateQa.isQaBuild(context))' app/src/main/java/com/navtasks/app/PlanAndTasksUi.kt
          grep -Fq 'test(1|2|3)' app/src/main/java/com/navtasks/app/NavTestUpdateFeed.kt
          grep -Fq 'MessageDigest.isEqual(installedDigest, archiveDigest)' app/src/main/java/com/navtasks/app/NavUpdateInstaller.kt
          test -f app/src/test/java/com/navtasks/app/NavAutomaticOfferQaTest.kt
      - name: Restore existing signing key
        env:
          KEYSTORE_B64: ${{ secrets.NAVTASKS_BETA_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$GITHUB_WORKSPACE/navtasks-beta-sign.p12"
          chmod 600 "$GITHUB_WORKSPACE/navtasks-beta-sign.p12"
      - name: Full JVM tests and signed release build (NO PUBLIC PUBLISH)
        env:
          NAVTASKS_BETA_KEYSTORE_PATH: ${{ github.workspace }}/navtasks-beta-sign.p12
          NAVTASKS_BETA_SIGN_PASSWORD: ${{ secrets.NAVTASKS_BETA_SIGN_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$NAVTASKS_BETA_SIGN_PASSWORD"
          gradle :app:testDebugUnitTest :app:assembleRelease --no-daemon
      - name: Verify installed package, signed certificate and baseline compatibility
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          SIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -s "$APK"
          "$AAPT" dump badging "$APK" | grep -F "package: name='com.navtasks.app.glass' versionCode='182' versionName='0.4.160-rc15'"
          "$AAPT" dump badging "$APK" | grep -F "sdkVersion:'31'"
          ! "$AAPT" dump badging "$APK" | grep -Fq 'application-debuggable'
          "$SIGNER" verify --min-sdk-version 31 "$APK"
          ACTUAL="$("$SIGNER" verify --print-certs "$APK" | awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {print $2; exit}')"
          test "$ACTUAL" = "0cb8a3c691e3fb2198682dff8c226aec710e77c7b8fded7d260a92f359a49c54"
          for ITEM in             'v0.4.118-notification-widget-verified|NavTasks_Reliability_0.4.118_Beta_Update.zip|143'             'v0.4.140-personal-search-fix-verified|NavTasks_Personal_Search_Fix_0.4.140_Beta_Update.zip|165'; do
            IFS='|' read -r TAG ZIP CODE <<< "$ITEM"
            DIR="$RUNNER_TEMP/baseline-$CODE"
            mkdir -p "$DIR"
            gh release download "$TAG" --pattern "$ZIP" --repo "$GITHUB_REPOSITORY" --dir "$DIR"
            ENTRY="$(unzip -Z1 "$DIR/$ZIP" | grep -E '\.apk$')"
            test -n "$ENTRY"
            unzip -p "$DIR/$ZIP" "$ENTRY" > "$DIR/baseline.apk"
            "$SIGNER" verify --min-sdk-version 31 "$DIR/baseline.apk"
            BASE_CERT="$("$SIGNER" verify --print-certs "$DIR/baseline.apk" | awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {print $2; exit}')"
            test "$ACTUAL" = "$BASE_CERT"
            test 182 -gt "$CODE"
          done
          mkdir -p dist
          cp "$APK" dist/NavTasks_0.4.160_RC15_Auto_Offer_Private.apk
          (cd dist && sha256sum NavTasks_0.4.160_RC15_Auto_Offer_Private.apk > NavTasks_0.4.160_RC15_Auto_Offer_Private.apk.sha256)
          (cd dist && sha256sum -c NavTasks_0.4.160_RC15_Auto_Offer_Private.apk.sha256)
      - name: Delete temporary signing key
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/navtasks-beta-sign.p12"
      - name: Publish only PRIVATE draft RC15, never stable/test channel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='v0.4.160-rc15-auto-offer-private'
          HEAD="$(gh api "repos/$GITHUB_REPOSITORY/branches/feature/navtasks-release-qa-auto-offer-0.4.160-rc15" --jq '.commit.sha')"
          test "$HEAD" = "$GITHUB_SHA"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Existing PRIVATE draft unchanged"
          else
            gh release create "$TAG"               dist/NavTasks_0.4.160_RC15_Auto_Offer_Private.apk               dist/NavTasks_0.4.160_RC15_Auto_Offer_Private.apk.sha256               --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA"               --title "NavTasks 0.4.160 RC15 · startup auto-offer QA PRIVATE"               --notes "PRIVATE DRAFT ONLY code182 same signer/package. QA-only opt-in startup TEST offers, stable.json remains unavailable, test.json unchanged. No source/store/Glass changes. Not stable 1.0.0. User FULL profile export before any in-place install; physical HONOR/Samsung acceptance pending. Future TEST3 code184 and higher-code recovery require separate gated approval."               --draft --prerelease
          fi
