name: NavTasks 0.4.69 Beta - restore last approved Glass
on:
  push:
    branches: [feature/navtasks-0.4.69-glass-recovery]
    paths:
      - 'app/**'
      - '.github/workflows/navtasks-glass-recovery-0.4.69.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: sdkmanager --install 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Restore signed installed-app Beta key
        env:
          KEYSTORE_B64: ${{ secrets.NAVTASKS_BETA_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$GITHUB_WORKSPACE/navtasks-beta-sign.p12"
          test -s "$GITHUB_WORKSPACE/navtasks-beta-sign.p12"
      - name: Verify tiny scope and run complete app test suite
        env:
          NAVTASKS_BETA_KEYSTORE_PATH: ${{ github.workspace }}/navtasks-beta-sign.p12
          NAVTASKS_BETA_SIGN_PASSWORD: ${{ secrets.NAVTASKS_BETA_SIGN_PASSWORD }}
        run: |
          set -euo pipefail
          grep -Fq 'applicationIdSuffix = ".glass"' app/build.gradle.kts
          grep -Fq 'versionNameSuffix = "-beta"' app/build.gradle.kts
          grep -Fq 'versionCode = 94' app/build.gradle.kts
          grep -Fq 'versionName = "0.4.69"' app/build.gradle.kts
          test "$(git hash-object app/src/main/java/com/navtasks/app/ServicesUi.kt)" = '7fe8ef1411a03d72b96b4a1a8889b838f109d762'
          test "$(git hash-object app/src/main/java/com/navtasks/app/ServiceStore.kt)" = '7aa928afb8c7a1f1e22ac5454ec243b69d1e32cb'
          test "$(git hash-object app/src/main/java/com/navtasks/app/NavTasksUi.kt)" = '1689ecde1e0d70264c584e300a1e324f04987f12'
          test "$(git hash-object app/src/main/java/com/navtasks/app/NavLiquidDockOptics.kt)" = 'b63f59048d3798f04f4b722c5e862de4814a42ec'
          test "$(git hash-object app/src/main/java/com/navtasks/app/NavLiquidGlassDock.kt)" = '4d20d574afcca5cf356972797829252e9366e6fa'
          test "$(git hash-object app/src/main/java/com/navtasks/app/NavLiquidGlassActionButton.kt)" = 'a551bac11ad051c1c72c68bb1030d084cacfef87'
          test "$(git hash-object app/src/main/java/com/navtasks/app/NavSolidCardTokens.kt)" = 'ee7c0f4388164d05490f89a2e63ae461fc9dfbf8'
          test ! -f app/src/main/java/com/navtasks/app/ServiceRequestsFilter.kt
          gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon
      - name: Remove key from runner
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/navtasks-beta-sign.p12"
      - name: Verify signed APK identity and small ZIP integrity
        run: |
          set -euo pipefail
          APK=NavTasks_Glass_Restore_0.4.69_Beta.apk
          ZIP=NavTasks_Glass_Restore_0.4.69_Beta.zip
          test -s app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | grep -F "package: name='com.navtasks.app.glass' versionCode='94' versionName='0.4.69-beta'"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          zip -9 -X "$ZIP" "$APK"
          unzip -t "$ZIP"
          test "$(sha256sum "$APK" | cut -d ' ' -f 1)" = "$(unzip -p "$ZIP" "$APK" | sha256sum | cut -d ' ' -f 1)"
          echo "ZIP bytes: $(stat -c %s "$ZIP")"
          sha256sum "$ZIP"
      - name: Publish one in-place Beta ZIP directly in Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=v0.4.69-glass-recovery
          ZIP=NavTasks_Glass_Restore_0.4.69_Beta.zip
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" --clobber
          else
            gh release create "$TAG" "$ZIP" --target "$GITHUB_SHA" \
              --title "NavTasks 0.4.69 Beta - recovery of previous Liquid Glass" \
              --notes "ROLLBACK ONLY. Same signed com.navtasks.app.glass code94. Exact old 0.4.66 source: entire user-approved Liquid Glass and one-green animation preserved; new Services Requests filter removed. Install over 0.4.68 code93 only if needed, without uninstalling. Export full profile before any upgrade. All existing local data/profile formats unchanged. Future same-package versionCode must exceed 94." \
              --prerelease
          fi
