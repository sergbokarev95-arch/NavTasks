name: PRIVATE NavTasks 0.4.181-qa9 code206 WIDGET NIGHT ALPHA (DO NOT PUBLISH)
on:
  push:
    branches:
      - feature/navtasks-qa9-widget-alpha-code206
    paths:
      - 'app/**'
      - '.github/workflows/navtasks-private-widget-alpha-qa9-code206.yml'
  workflow_dispatch:

concurrency:
  group: navtasks-private-widget-alpha-qa9-code206-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  signed-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: sdkmanager --install 'platforms;android-36' 'platforms;android-36-ext19' 'build-tools;35.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Restore ORIGINAL NavTasks signing key (never generate another)
        env:
          KEYSTORE_B64: ${{ secrets.NAVTASKS_BETA_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$GITHUB_WORKSPACE/navtasks-beta-sign.p12"
          chmod 600 "$GITHUB_WORKSPACE/navtasks-beta-sign.p12"
          test -s "$GITHUB_WORKSPACE/navtasks-beta-sign.p12"
      - name: Build pre1.0 QA only (PRIVATE, NO PUBLISH)
        env:
          NAVTASKS_BETA_KEYSTORE_PATH: ${{ github.workspace }}/navtasks-beta-sign.p12
          NAVTASKS_BETA_SIGN_PASSWORD: ${{ secrets.NAVTASKS_BETA_SIGN_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$NAVTASKS_BETA_SIGN_PASSWORD"
          gradle :app:testDebugUnitTest :app:assembleRelease --no-daemon
      - name: Verify QA identity, version and historic signature
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.navtasks.app.glass' versionCode='206' versionName='0.4.181-qa9'"
          ! "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -Fq 'application-debuggable'
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --min-sdk-version 31 "$APK"
          ACTUAL="$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {print $2; exit}')"
          test "$ACTUAL" = 0cb8a3c691e3fb2198682dff8c226aec710e77c7b8fded7d260a92f359a49c54
      - name: Save verified QA APK as PRIVATE DRAFT release (not latest, not stable)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/NavTasks-0.4.181-qa9-code206.apk"
          gh release create "navtasks-private-widget-alpha-qa9-code206" \
            "$RUNNER_TEMP/NavTasks-0.4.181-qa9-code206.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --draft --latest=false \
            --target "$GITHUB_SHA" \
            --title "PRIVATE NavTasks 0.4.181-qa9 code206 WIDGET NIGHT ALPHA (DO NOT PUBLISH)" \
            --notes "Private QA9: only change the night widget background from near-opaque black to subtly translucent 88% black (#E0000000). All previous accepted QA8 functionality retained: wide percent next to progress, paired light/dark RemoteViews, PDF and Open with, tasks and profile logic. Android system changes while process fully stopped may be delayed by the OS; no promises of immediate background updates. In-place install only after exporting full profile and .navlib and downloading exact QA8 source recovery code207. Never uninstall or clear data, no public stable feed."
      - name: Erase temporary signing key
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/navtasks-beta-sign.p12"
