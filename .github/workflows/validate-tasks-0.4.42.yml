name: Validate NavTasks 0.4.42 Tasks always visible
on:
  push:
    branches: [tasks-always-visible-0.4.42]
    paths: ['.github/workflows/validate-tasks-0.4.42.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: sdkmanager --install 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Verify version and no collapsed task stack
        run: |
          set -euo pipefail
          grep -q 'versionName = "0.4.42"' app/build.gradle.kts
          ! grep -q 'listExpanded' app/src/main/java/com/navtasks/app/PlanAndTasksUi.kt
          ! grep -q 'taskListArrow' app/src/main/java/com/navtasks/app/PlanAndTasksUi.kt
      - name: Run unit and regression tests
        run: gradle :app:testDebugUnitTest --no-daemon
      - name: Assemble APK and validate Compose layout
        run: gradle :app:assembleDebug --no-daemon
