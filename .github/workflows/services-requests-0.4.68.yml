name: NavTasks 0.4.68 Beta - current AMOS service requests filter
on:
  push:
    branches: [feature/service-requests-filter-0.4.68-beta]
    paths:
      - 'app/**'
      - '.github/workflows/services-requests-0.4.68.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: sdkmanager --install 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Restore signed installed-app Beta key
        env:
          KEYSTORE_B64: ${{ secrets.NAVTASKS_BETA_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$GITHUB_WORKSPACE/navtasks-beta-sign.p12"
          test -s "$GITHUB_WORKSPACE/navtasks-beta-sign.p12"
      - name: Verify tiny scope and run complete app test suite
        env:
          NAVTASKS_BETA_KEYSTORE_PATH: ${{ github.workspace }}/navtasks-beta-sign.p12
          NAVTASKS_BETA_SIGN_PASSWORD: ${{ secrets.NAVTASKS_BETA_SIGN_PASSWORD }}
        run: |
          set -euo pipefail
          grep -Fq 'applicationIdSuffix = ".glass"' app/build.gradle.kts
          grep -Fq 'versionNameSuffix = "-beta"' app/build.gradle.kts
          grep -Fq 'versionCode = 93' app/build.gradle.kts
          grep -Fq 'versionName = "0.4.68"' app/build.gradle.kts
          test "$(git hash-object app/src/main/java/com/navtasks/app/ServicesUi.kt)" = '9082946c569cd34d107dd666d703404fb31f934a'
          test "$(git hash-object app/src/main/java/com/navtasks/app/ServiceRequestsFilter.kt)" = 'a2deae5d8bfe1128831c02a902669c6c1ec3a42d'
          test "$(git hash-object app/src/main/java/com/navtasks/app/ServiceStore.kt)" = '7aa928afb8c7a1f1e22ac5454ec243b69d1e32cb'
          test "$(git hash-object app/src/main/java/com/navtasks/app/NavTasksUi.kt)" = '1689ecde1e0d70264c584e300a1e324f04987f12'
          test "$(git hash-object app/src/main/java/com/navtasks/app/NavLiquidDockOptics.kt)" = 'b63f59048d3798f04f4b722c5e862de4814a42ec'
          test "$(git hash-object app/src/main/java/com/navtasks/app/NavLiquidGlassDock.kt)" = '4d20d574afcca5cf356972797829252e9366e6fa'
          test "$(git hash-object app/src/main/java/com/navtasks/app/NavLiquidGlassActionButton.kt)" = 'a551bac11ad051c1c72c68bb1030d084cacfef87'
          test "$(git hash-object app/src/main/java/com/navtasks/app/NavSolidCardTokens.kt)" = 'ee7c0f4388164d05490f89a2e63ae461fc9dfbf8'
          grep -Fq '"Заявки · ' app/src/main/java/com/navtasks/app/ServicesUi.kt
          grep -Fq 'currentServiceRequests(activeServices)' app/src/main/java/com/navtasks/app/ServicesUi.kt
          gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon
      - name: Remove key from runner
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/navtasks-beta-sign.p12"
      - name: Verify signed APK identity and small ZIP integrity
        run: |
          set -euo pipefail
          APK=NavTasks_Services_Requests_0.4.68_Beta.apk
          ZIP=NavTasks_Services_Requests_0.4.68_Beta_Update.zip
          test -s app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | grep -F "package: name='com.navtasks.app.glass' versionCode='93' versionName='0.4.68-beta'"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          zip -9 -X "$ZIP" "$APK"
          unzip -t "$ZIP"
          test "$(sha256sum "$APK" | cut -d ' ' -f 1)" = "$(unzip -p "$ZIP" "$APK" | sha256sum | cut -d ' ' -f 1)"
          echo "ZIP bytes: $(stat -c %s "$ZIP")"
          sha256sum "$ZIP"
      - name: Publish one in-place Beta ZIP directly in Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=v0.4.68-service-requests-candidate
          ZIP=NavTasks_Services_Requests_0.4.68_Beta_Update.zip
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" --clobber
          else
            gh release create "$TAG" "$ZIP" --target "$GITHUB_SHA" \
              --title "NavTasks 0.4.68 Beta - Current AMOS Requests tab in Services" \
              --notes "IN-PLACE update of original com.navtasks.app.glass with same Beta key, code93. Export complete profiles, NEVER uninstall. Services now has Работы (all active), Заявки (active NOT completed services having nonblank current AMOS requestNumber, planned + unplanned), Закрытые (unchanged archive). Requests is a FILTER ONLY; no new module or data fields. Existing search, actions, due-date counters, history/notification logic unchanged. All approved Liquid Glass source hashes unchanged. User testing on HONOR is required; stable main code not merged. Signed ZIP contains APK, and a code94 same-glass recovery is provided separately." \
              --prerelease
          fi
