name: NavTasks Liquid Glass Surfaces Preview 2 - finish
on:
  push:
    branches: [feature/liquid-glass-surface-preview2]
    paths:
      - 'app/**'
      - '.github/workflows/liquid-glass-surface-preview2.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: sdkmanager --install 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Restore Beta key for same isolated preview package
        env:
          KEYSTORE_B64: ${{ secrets.NAVTASKS_BETA_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$GITHUB_WORKSPACE/navtasks-beta-sign.p12"
          test -s "$GITHUB_WORKSPACE/navtasks-beta-sign.p12"
      - name: Verify two scoped changes and run full app regression tests
        env:
          NAVTASKS_BETA_KEYSTORE_PATH: ${{ github.workspace }}/navtasks-beta-sign.p12
          NAVTASKS_BETA_SIGN_PASSWORD: ${{ secrets.NAVTASKS_BETA_SIGN_PASSWORD }}
        run: |
          set -euo pipefail
          grep -Fq 'applicationIdSuffix = ".glasssurface"' app/build.gradle.kts
          grep -Fq 'versionNameSuffix = "-surface-preview2"' app/build.gradle.kts
          grep -Fq 'versionCode = 84' app/build.gradle.kts
          grep -Fq 'Color(0xFF3F4B58).copy(alpha = .82f)' app/src/main/java/com/navtasks/app/NavLiquidGlassDock.kt
          grep -Fq '.padding(top = 8.dp, bottom = 4.dp)' app/src/main/java/com/navtasks/app/NavTasksUi.kt
          # Exact blob SHA for changed components and unchanged card/optical materials.
          test "$(git hash-object app/src/main/java/com/navtasks/app/NavTasksUi.kt)" = '7ff7ff4faf0a288787dce7397f3469269054c16a'
          test "$(git hash-object app/src/main/java/com/navtasks/app/NavLiquidGlassDock.kt)" = '53e713f4272f7be6db75e3cfdb65b22d5f55b702'
          test "$(git hash-object app/src/main/java/com/navtasks/app/NavSolidCardTokens.kt)" = 'ee7c0f4388164d05490f89a2e63ae461fc9dfbf8'
          test "$(git hash-object app/src/main/java/com/navtasks/app/NavGlass.kt)" = 'e3ac00c1f555205bce0f8b59b6faf2c817ffe034'
          test "$(git hash-object app/src/main/java/com/navtasks/app/NavLiquidDockOptics.kt)" = 'b63f59048d3798f04f4b722c5e862de4814a42ec'
          gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon
      - name: Remove temporary signing material
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/navtasks-beta-sign.p12"
      - name: Verify package ID and create bandwidth-friendly signed ZIP
        run: |
          set -euo pipefail
          APK=NavTasks_LiquidGlass_Surfaces_Preview2.apk
          ZIP=NavTasks_LiquidGlass_Surfaces_Preview2.zip
          test -s app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | grep -F "package: name='com.navtasks.app.glasssurface' versionCode='84'"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          zip -9 -X "$ZIP" "$APK"
          unzip -t "$ZIP"
          test "$(sha256sum "$APK" | cut -d ' ' -f 1)" = "$(unzip -p "$ZIP" "$APK" | sha256sum | cut -d ' ' -f 1)"
          echo "ZIP bytes: $(stat -c %s "$ZIP")"
          sha256sum "$ZIP"
      # Release assets are not subject to the full GitHub Actions artifacts
      # storage quota. Publish the already validated ZIP directly below.
      - name: Publish separate preview prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=glasssurfaces-preview2
          ZIP=NavTasks_LiquidGlass_Surfaces_Preview2.zip
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" --clobber
          else
            gh release create "$TAG" "$ZIP" --target "$GITHUB_SHA" \
              --title "NavTasks Liquid Glass - polished Surfaces Preview 2" \
              --notes "SEPARATE PREVIEW APP com.navtasks.app.glasssurface, safely updates Preview 1, not installed NavTasks. User-approved opaque gradients/borders are unchanged. Two tweaks only: Night resting capsule darker neutral graphite (0xFF3F4B58 alpha .82 vs 0xFF616B77 alpha .86), 4dp lower dock (bottom padding 8dp to 4dp). Original 56dp dock, proportional 1.3x lens, Backdrop refraction, active blue, day palette, business logic and storage unchanged. ZIP contains same signed APK. Please compare dark blue icon and gesture bar clearance; full app migration requires HONOR acceptance." \
              --prerelease
          fi
