name: NavTasks 0.4.73 Beta - Handover editor safe recovery
on:
  push:
    branches: [feature/navtasks-0.4.73-richnotes-recovery]
    paths:
      - 'app/**'
      - '.github/workflows/handover-edit-recovery-0.4.73.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: sdkmanager --install 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Restore signed installed-app Beta key
        env:
          KEYSTORE_B64: ${{ secrets.NAVTASKS_BETA_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$GITHUB_WORKSPACE/navtasks-beta-sign.p12"
          test -s "$GITHUB_WORKSPACE/navtasks-beta-sign.p12"
      - name: Verify tiny scope and run complete app test suite
        env:
          NAVTASKS_BETA_KEYSTORE_PATH: ${{ github.workspace }}/navtasks-beta-sign.p12
          NAVTASKS_BETA_SIGN_PASSWORD: ${{ secrets.NAVTASKS_BETA_SIGN_PASSWORD }}
        run: |
          set -euo pipefail
          grep -Fq 'applicationIdSuffix = ".glass"' app/build.gradle.kts
          grep -Fq 'versionNameSuffix = "-beta"' app/build.gradle.kts
          grep -Fq 'versionCode = 98' app/build.gradle.kts
          grep -Fq 'versionName = "0.4.73"' app/build.gradle.kts
          test "$(git hash-object app/src/main/java/com/navtasks/app/NavLiquidDockOptics.kt)" = 'b63f59048d3798f04f4b722c5e862de4814a42ec'
          test "$(git hash-object app/src/main/java/com/navtasks/app/NavLiquidGlassDock.kt)" = '4d20d574afcca5cf356972797829252e9366e6fa'
          test "$(git hash-object app/src/main/java/com/navtasks/app/NavLiquidGlassActionButton.kt)" = 'a551bac11ad051c1c72c68bb1030d084cacfef87'
          test "$(git hash-object app/src/main/java/com/navtasks/app/NavSolidCardTokens.kt)" = 'ee7c0f4388164d05490f89a2e63ae461fc9dfbf8'
          grep -Fq '"Заявки · ' app/src/main/java/com/navtasks/app/ServicesUi.kt
          grep -Fq 'currentServiceRequests(activeServices)' app/src/main/java/com/navtasks/app/ServicesUi.kt
          test "$(git hash-object app/src/main/java/com/navtasks/app/NavLiquidDockTabs.kt)" = 'a30dbb3dd6e80b2531b826ddc0873bdd5ec5a412'
          test "$(git hash-object app/src/main/java/com/navtasks/app/NavQuickProfileUi.kt)" = '43adbfa9f50229a7ec532b0f6332a3aca160331e'
          test "$(git hash-object app/src/main/java/com/navtasks/app/TaskStore.kt)" = 'ab422f5c07755bf1f7e1b78edbe693f675f7d12e'
          grep -Fq 'versionCode = 98' app/build.gradle.kts
          grep -Fq 'richeditor-compose:1.0.0-rc14' app/build.gradle.kts
          grep -Fq 'NavTitleKeyboard' app/src/main/java/com/navtasks/app/NavGlass.kt
          grep -Fq 'NavRichNoteEditor(' app/src/main/java/com/navtasks/app/ChecklistNotesUi.kt
          grep -Fq 'NavRichNoteEditor(' app/src/main/java/com/navtasks/app/ServicesUi.kt
          grep -Fq 'NavRichNoteEditor(' app/src/main/java/com/navtasks/app/HandoverUi.kt
          grep -Fq 'NavRichNoteEditor(' app/src/main/java/com/navtasks/app/WorkOrdersUi.kt
          gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon
      - name: Remove key from runner
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/navtasks-beta-sign.p12"
      - name: Verify signed APK identity and small ZIP integrity
        run: |
          set -euo pipefail
          APK=NavTasks_Handover_Restore_0.4.73_Beta.apk
          ZIP=NavTasks_Handover_Restore_0.4.73_Beta_Update.zip
          test -s app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | grep -F "package: name='com.navtasks.app.glass' versionCode='98' versionName='0.4.73-beta'"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          zip -9 -X "$ZIP" "$APK"
          unzip -t "$ZIP"
          test "$(sha256sum "$APK" | cut -d ' ' -f 1)" = "$(unzip -p "$ZIP" "$APK" | sha256sum | cut -d ' ' -f 1)"
          echo "ZIP bytes: $(stat -c %s "$ZIP")"
          sha256sum "$ZIP"
      - name: Publish one in-place Beta ZIP directly in Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=v0.4.73-handover-edit-recovery
          ZIP=NavTasks_Handover_Restore_0.4.73_Beta_Update.zip
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" --clobber
          else
            gh release create "$TAG" "$ZIP" --target "$GITHUB_SHA" \
              --title "NavTasks 0.4.73 Beta - recovery of rich notes without dialog edit icon" \
              --notes "Same original rich notes and approved Liquid Glass as signed v0.4.70 code95, only versionCode98/versionName0.4.73. Recovery if new Handover title edit control code97 causes a problem. Data and rich HTML fields fully preserved as in v0.4.70; same application ID and beta signing. BACK UP full profiles, install over current APK without uninstalling; no downgrade, no data clearing." \
              --prerelease
          fi
