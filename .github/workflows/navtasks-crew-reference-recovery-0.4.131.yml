name: NavTasks 0.4.131 Beta - exact 0.4.128 app recovery
on:
  push:
    branches: [feature/navtasks-0.4.131-crew-reference-recovery]
    paths:
      - 'app/**'
      - '.github/workflows/navtasks-crew-reference-recovery-0.4.131.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: sdkmanager --install 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Restore existing signed Beta key
        env:
          KEYSTORE_B64: ${{ secrets.NAVTASKS_BETA_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$GITHUB_WORKSPACE/navtasks-beta-sign.p12"
          test -s "$GITHUB_WORKSPACE/navtasks-beta-sign.p12"
      - name: Verify profile routing, frozen glass/data code, tests and signed build
        env:
          NAVTASKS_BETA_KEYSTORE_PATH: ${{ github.workspace }}/navtasks-beta-sign.p12
          NAVTASKS_BETA_SIGN_PASSWORD: ${{ secrets.NAVTASKS_BETA_SIGN_PASSWORD }}
        run: |
          set -euo pipefail
          grep -Fq 'applicationIdSuffix = ".glass"' app/build.gradle.kts
          grep -Fq 'versionNameSuffix = "-beta"' app/build.gradle.kts
          grep -Fq 'versionCode = 156' app/build.gradle.kts
          grep -Fq 'versionName = "0.4.131"' app/build.gradle.kts
          test "$(git hash-object app/src/main/java/com/navtasks/app/NavLiquidDockOptics.kt)" = 'b63f59048d3798f04f4b722c5e862de4814a42ec'
          grep -Fq 'NavLiquidDockTabs.repeatTapScale' app/src/main/java/com/navtasks/app/NavLiquidGlassDock.kt
          grep -Fq 'stiffness = 550f' app/src/main/java/com/navtasks/app/NavLiquidGlassDock.kt
          grep -Fq 'stiffness = 600f' app/src/main/java/com/navtasks/app/NavLiquidGlassDock.kt
          grep -Fq 'if (active) repeatedTapSerial++' app/src/main/java/com/navtasks/app/NavLiquidGlassDock.kt
          grep -Fq 'RoutinesModuleScreen(' app/src/main/java/com/navtasks/app/NavTasksUi.kt
          grep -Fq 'TasksScreenV2(' app/src/main/java/com/navtasks/app/RoutinesModuleScreen.kt
          grep -Fq 'onTasks = { showRoutineTasks = true }' app/src/main/java/com/navtasks/app/NavTasksUi.kt
          grep -Fq 'onClick = onTasks' app/src/main/java/com/navtasks/app/WorksHubUi.kt
          ! grep -Fq 'title = localized("Инспекции"' app/src/main/java/com/navtasks/app/WorksHubUi.kt
          grep -Fq 'ReferenceHubScreen(palette, lang' app/src/main/java/com/navtasks/app/NavTasksUi.kt
          grep -Fq 'NavLiquidDockTab("reference", "Справочник")' app/src/main/java/com/navtasks/app/NavLiquidDockTabs.kt
          grep -Fq 'localized("Справочник", "Reference", lang)' app/src/main/java/com/navtasks/app/NavGlass.kt
          grep -Fq 'class ReferenceNavigationTest' app/src/test/java/com/navtasks/app/ReferenceNavigationTest.kt
          grep -Fq 'bottom = navFloatingActionBottomPadding(embeddedInTab = true)' app/src/main/java/com/navtasks/app/NavTasksUi.kt
          grep -Fq 'bottom = navFloatingActionBottomPadding(embeddedInTab)' app/src/main/java/com/navtasks/app/HandoverUi.kt
          grep -Fq 'class NavFloatingActionSafeAreaTest' app/src/test/java/com/navtasks/app/NavFloatingActionSafeAreaTest.kt
          grep -Fq 'WindowInsets.navigationBars' app/src/main/java/com/navtasks/app/NavFloatingActionSafeArea.kt
          grep -Fq 'padding(start = 19.dp, bottom = 83.dp)' app/src/main/java/com/navtasks/app/NavTasksUi.kt
          grep -Fq 'padding(end = 19.dp, bottom = 83.dp)' app/src/main/java/com/navtasks/app/NavTasksUi.kt
          grep -Fq 'NavPressFeedbackTokens.floatingActionScale' app/src/main/java/com/navtasks/app/NavLiquidGlassActionButton.kt
          test "$(git hash-object app/src/main/java/com/navtasks/app/ServiceStore.kt)" = '9302d73141adb644f0ec8fe7210c010da7aae376'
          test "$(git hash-object app/src/main/java/com/navtasks/app/WorkOrderStore.kt)" = 'e721fd57a42403fefe4fca6d6c325a9c2a8acd46'
          grep -Fq 'Alignment.BottomStart' app/src/main/java/com/navtasks/app/NavTasksUi.kt
          grep -Fq 'FormLabel("Периодичность", "Frequency", lang, p)' app/src/main/java/com/navtasks/app/PlanAndTasksUi.kt
          ! grep -Fq 'else -> TasksScreenV2(' app/src/main/java/com/navtasks/app/NavTasksUi.kt
          test "$(git hash-object app/src/main/java/com/navtasks/app/WorkOrderStore.kt)" = 'e721fd57a42403fefe4fca6d6c325a9c2a8acd46'
          grep -Fq 'NavPressFeedbackTokens.floatingActionScale' app/src/main/java/com/navtasks/app/NavLiquidGlassActionButton.kt
          grep -Fq 'bottom = navFloatingActionBottomPadding(embeddedInTab)' app/src/main/java/com/navtasks/app/HandoverUi.kt
          grep -Fq 'HandoverFullNoteEditor(' app/src/main/java/com/navtasks/app/HandoverUi.kt
          test "$(git hash-object app/src/main/java/com/navtasks/app/ServiceStore.kt)" = '9302d73141adb644f0ec8fe7210c010da7aae376'
          grep -Fq 'stiffness = 550f' app/src/main/java/com/navtasks/app/NavLiquidGlassDock.kt
          grep -Fq 'stiffness = 600f' app/src/main/java/com/navtasks/app/NavLiquidGlassDock.kt
          grep -Fq 'target = selected.coerceIn(' app/src/main/java/com/navtasks/app/NavLiquidGlassDock.kt
          grep -Fq 'if (active) repeatedTapSerial++' app/src/main/java/com/navtasks/app/NavLiquidGlassDock.kt
          grep -Fq 'tapPulse.animateTo(1f,' app/src/main/java/com/navtasks/app/NavLiquidGlassDock.kt
          grep -Fq 'NavLiquidDockTabs.repeatTapScale' app/src/main/java/com/navtasks/app/NavLiquidGlassDock.kt
          ! grep -Fq 'pressedTab' app/src/main/java/com/navtasks/app/NavLiquidGlassDock.kt
          ! grep -Fq 'clickedTab' app/src/main/java/com/navtasks/app/NavLiquidGlassDock.kt
          ! grep -Fq 'isHolding' app/src/main/java/com/navtasks/app/NavLiquidGlassDock.kt
          grep -Fq 'class NavLiquidDockClassicPulseTest' app/src/test/java/com/navtasks/app/NavLiquidDockClassicPulseTest.kt
          grep -Fq 'class NavLiquidGlassParityTest' app/src/test/java/com/navtasks/app/NavLiquidGlassParityTest.kt
          grep -Fq 'fun runs(raw: String)' app/src/main/java/com/navtasks/app/NavStorageRead.kt
          grep -Fq 'fun sections(raw: String)' app/src/main/java/com/navtasks/app/NavStorageRead.kt
          grep -Fq 'if (storageIssue != null) return' app/src/main/java/com/navtasks/app/TaskStore.kt
          grep -Fq 'ensureNavStorageWritable(storageIssue)' app/src/main/java/com/navtasks/app/HandoverStore.kt
          grep -Fq 'NavStorageRead.templates(' app/src/main/java/com/navtasks/app/ProfileStore.kt
          grep -Fq 'class NavStorageReadTest' app/src/test/java/com/navtasks/app/NavStorageReadTest.kt
          grep -Fq '!activeServiceReminderRecord(service)' app/src/main/java/com/navtasks/app/NavNotifications.kt
          grep -Fq '!activeAmosReminderRecord(order)' app/src/main/java/com/navtasks/app/NavNotifications.kt
          grep -Fq 'if (kind == ROLL)' app/src/main/java/com/navtasks/app/NavNotifications.kt
          grep -Fq 'nextNavWidgetRefresh(LocalDateTime.now())' app/src/main/java/com/navtasks/app/NavNotifications.kt
          grep -Fq 'NavWidgetUpdater.updateAll(context, store)' app/src/main/java/com/navtasks/app/NavNotifications.kt
          grep -Fq 'edgeToEdgeStandalone = true' app/src/main/java/com/navtasks/app/ServicesUi.kt
          grep -Fq 'edgeToEdgeStandalone = true' app/src/main/java/com/navtasks/app/WorkOrdersUi.kt
          grep -Fq 'class NavNotificationRolloverTest' app/src/test/java/com/navtasks/app/NavNotificationRolloverTest.kt
          test "$(git hash-object app/src/main/java/com/navtasks/app/NavNotifications.kt)" = '85827a03a176e42058d6872cc0900332ddf2be31'
          test "$(git hash-object app/src/main/java/com/navtasks/app/NavWidgets.kt)" = '13846a8266a4d3bd2de6d69405172a7b72335762'
          grep -Fq 'receiveOpenIntent(intent)' app/src/main/java/com/navtasks/app/MainActivity.kt
          grep -Fq 'LaunchedEffect(openRequest?.serial)' app/src/main/java/com/navtasks/app/NavTasksUi.kt
          grep -Fq 'resolveNavProfileTarget(' app/src/main/java/com/navtasks/app/NavTasksUi.kt
          grep -Fq 'class NavProfileDeepLinkTest' app/src/test/java/com/navtasks/app/NavProfileDeepLinkTest.kt
          grep -Fq 'class NavHandoverNotebookUiTest' app/src/test/java/com/navtasks/app/NavHandoverNotebookUiTest.kt
          grep -Fq 'class NavPopupFrostTest' app/src/test/java/com/navtasks/app/NavPopupFrostTest.kt
          grep -Fq 'window?.setBackgroundBlurRadius' app/src/main/java/com/navtasks/app/NavPopupFrost.kt
          grep -Fq 'NavApplyDialogFrost(frost)' app/src/main/java/com/navtasks/app/NavOverlayUi.kt
          grep -Fq 'handoverNotebookEntries(section.entries)' app/src/main/java/com/navtasks/app/HandoverUi.kt
          ! grep -Fq 'selectedEntry?.let' app/src/main/java/com/navtasks/app/HandoverUi.kt
          ! grep -Fq 'Проверить иконку уведомления' app/src/main/java/com/navtasks/app/PlanAndTasksUi.kt
          grep -Fq 'NavPressFeedbackTokens.floatingActionScale' app/src/main/java/com/navtasks/app/NavLiquidGlassActionButton.kt
          grep -Fq 'actualVersion' app/src/main/java/com/navtasks/app/PlanAndTasksUi.kt
          grep -Fq 'class NavPreReleaseUiPolishTest' app/src/test/java/com/navtasks/app/NavPreReleaseUiPolishTest.kt
          grep -Fq 'NavInfoSectionBanner(' app/src/main/java/com/navtasks/app/WorksHubUi.kt
          grep -Fq 'NavInfoSectionBanner(' app/src/main/java/com/navtasks/app/ReferenceHubUi.kt
          grep -Fq 'externalAddRequest = handoverAddRequest' app/src/main/java/com/navtasks/app/NavTasksUi.kt
          grep -Fq 'onExternalAddHandled()' app/src/main/java/com/navtasks/app/HandoverUi.kt
          grep -Fq 'delay(NavPressFeedbackTokens.minClickPulseMs)' app/src/main/java/com/navtasks/app/NavGlass.kt
          grep -Fq 'SCHEDULE_EXACT_ALARM_PERMISSION_STATE_CHANGED' app/src/main/AndroidManifest.xml
          grep -Fq '}.then(this).clickable(' app/src/main/java/com/navtasks/app/NavGlass.kt
          grep -Fq '"work-order" -> {' app/src/main/java/com/navtasks/app/NavGlass.kt
          grep -Fq 'icon = "work-order"' app/src/main/java/com/navtasks/app/WorksHubUi.kt
          grep -Fq 'NavInfoSectionBanner(' app/src/main/java/com/navtasks/app/HandoverUi.kt
          grep -Fq 'description: String? = null' app/src/main/java/com/navtasks/app/NavInfoSectionBanner.kt
          gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon
      - name: Remove signing key
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/navtasks-beta-sign.p12"
      - name: Verify signed APK, package/version and ZIP integrity
        run: |
          set -euo pipefail
          APK=NavTasks_Original_0.4.128_Restore_0.4.131_Beta.apk
          ZIP=NavTasks_Original_0.4.128_Restore_0.4.131_Beta_Update.zip
          test -s app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | grep -F "package: name='com.navtasks.app.glass' versionCode='156' versionName='0.4.131-beta'"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          zip -9 -X "$ZIP" "$APK"
          unzip -t "$ZIP"
          test "$(sha256sum "$APK" | cut -d ' ' -f 1)" = "$(unzip -p "$ZIP" "$APK" | sha256sum | cut -d ' ' -f 1)"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"
      - name: Publish immutable verified Beta only from current branch head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=v0.4.131-crew-reference-recovery
          CURRENT_SHA="$(gh api "repos/$GITHUB_REPOSITORY/branches/feature/navtasks-0.4.131-crew-reference-recovery" --jq '.commit.sha')"
          if [ "$CURRENT_SHA" != "$GITHUB_SHA" ]; then
            echo "Superseded source; not publishing stale artifact"
            exit 0
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Immutable release exists, not overwriting."
          else
            gh release create "$TAG" "$ZIP" --target "$GITHUB_SHA" \
              --title "NavTasks 0.4.131 Beta - exact 0.4.128 recovery" \
              --notes "Signed in-place recovery of EXACT 0.4.128 application sources (whole-surface glass tap, existing AMOS title, 14sp full note body and unchanged Reference), ONLY build version 0.4.131-beta/code156 and isolated workflow added. Use if v0.4.130 is rejected on device. Export FULL profiles first, NEVER uninstall or clear app storage. After recovery, any later same-package update must use versionCode >=157." \
              --prerelease
          fi
