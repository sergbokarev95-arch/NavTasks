name: Publish NavTasks Glass 0.4.59 APK
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-0.4.59-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out verified 0.4.59 stable Haze dock source
        uses: actions/checkout@v4
        with:
          ref: b22057ad92b0f531df12217c4ecee97150395951
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: sdkmanager --install 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Restore stable beta signing key
        env:
          KEYSTORE_B64: ${{ secrets.NAVTASKS_BETA_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$GITHUB_WORKSPACE/navtasks-beta-sign.p12"
          test -s "$GITHUB_WORKSPACE/navtasks-beta-sign.p12"
      - name: Verify source and run regression tests
        env:
          NAVTASKS_BETA_KEYSTORE_PATH: ${{ github.workspace }}/navtasks-beta-sign.p12
          NAVTASKS_BETA_SIGN_PASSWORD: ${{ secrets.NAVTASKS_BETA_SIGN_PASSWORD }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "b22057ad92b0f531df12217c4ecee97150395951"
          grep -q 'versionName = "0.4.59"' app/build.gradle.kts
          grep -q 'versionCode = 81' app/build.gradle.kts
          if grep -Fq 'Column(Modifier.fillMaxSize().statusBarsPadding().navigationBarsPadding()' \
              app/src/main/java/com/navtasks/app/ServicesUi.kt \
              app/src/main/java/com/navtasks/app/WorkOrdersUi.kt; then
            echo "::error::Standalone work pages must be edge-to-edge"
            exit 1
          fi
          if grep -Fq '.border(if (isToday) 2.dp else 1.dp' app/src/main/java/com/navtasks/app/PlanAndTasksUi.kt; then
            echo "::error::Bright month-cell borders regressed"
            exit 1
          fi
          # The three floating creation controls must be anchored at bottom-right.
          grep -Fq 'Modifier.align(Alignment.BottomEnd).navigationBarsPadding()' app/src/main/java/com/navtasks/app/NavTasksUi.kt
          grep -Fq 'Modifier.align(Alignment.BottomEnd).navigationBarsPadding()' app/src/main/java/com/navtasks/app/ServicesUi.kt
          grep -Fq 'Modifier.align(Alignment.BottomEnd).navigationBarsPadding()' app/src/main/java/com/navtasks/app/WorkOrdersUi.kt
          grep -Fq 'Modifier.align(Alignment.BottomEnd)' app/src/main/java/com/navtasks/app/HandoverUi.kt
          grep -Fq '.padding(end = 19.dp, bottom = if (embeddedInTab) 83.dp else 18.dp)' app/src/main/java/com/navtasks/app/HandoverUi.kt
          if grep -Fq 'Modifier.align(Alignment.BottomStart)' app/src/main/java/com/navtasks/app/HandoverUi.kt; then
            echo "::error::Handover Add control is left-aligned"
            exit 1
          fi
          if grep -Fq 'Modifier.align(Alignment.BottomStart).navigationBarsPadding()' app/src/main/java/com/navtasks/app/ServicesUi.kt app/src/main/java/com/navtasks/app/WorkOrdersUi.kt; then
            echo "::error::Standalone Add controls regressed to left"
            exit 1
          fi
          grep -Fq 'weekend = calendarIsWeekend(day)' app/src/main/java/com/navtasks/app/NavTasksUi.kt
          grep -Fq 'calendarWeekendInk(p)' app/src/main/java/com/navtasks/app/NavTasksUi.kt
          if grep -Eq '<Space([[:space:]]|>)' app/src/main/res/layout/navtasks_widget_*.xml; then
            echo "::error::Unsupported Space in RemoteViews layout"
            exit 1
          fi
          # 0.4.57/0.4.58 runtime AGSL experiment is rejected by HONOR.
          # Verify that NavGlass.kt is byte-identical to pre-optics 0.4.56.
          test "$(git hash-object app/src/main/java/com/navtasks/app/NavGlass.kt)" = "80c0a8aef011ac9212a1516e7e74071a9290ddad"
          grep -Fq '.navFrostedOverlay(p, hazeState, radius = 30.dp, role = GlassRole.NAVIGATION)' app/src/main/java/com/navtasks/app/NavGlass.kt
          if grep -Eq 'createNavDockRefraction|navHazeBackdrop|renderEffect = refractiveEffect' app/src/main/java/com/navtasks/app/NavGlass.kt; then
            echo "::error::Rejected AGSL optics was re-enabled"
            exit 1
          fi
          gradle :app:testDebugUnitTest --no-daemon
      - name: Build stable-signed debug APK
        env:
          NAVTASKS_BETA_KEYSTORE_PATH: ${{ github.workspace }}/navtasks-beta-sign.p12
          NAVTASKS_BETA_SIGN_PASSWORD: ${{ secrets.NAVTASKS_BETA_SIGN_PASSWORD }}
        run: gradle :app:assembleDebug --no-daemon
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/navtasks-beta-sign.p12"
      - name: Package compact ZIP directly from build
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          mkdir -p upload
          cp app/build/outputs/apk/debug/app-debug.apk upload/NavTasks_Glass_0.4.59_Beta.apk
          sha256sum upload/NavTasks_Glass_0.4.59_Beta.apk
          cd upload
          zip -q NavTasks_Glass_0.4.59_Build.zip NavTasks_Glass_0.4.59_Beta.apk
          unzip -t NavTasks_Glass_0.4.59_Build.zip
          cd ..
      - name: Publish 0.4.59 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v0.4.59-glass-beta \
            upload/NavTasks_Glass_0.4.59_Beta.apk \
            upload/NavTasks_Glass_0.4.59_Build.zip \
            --repo "${{ github.repository }}" \
            --target b22057ad92b0f531df12217c4ecee97150395951 \
            --prerelease \
            --title "NavTasks Glass 0.4.59 Beta · Stable Haze Dock" \
            --notes "NavTasks 0.4.59 stability hotfix after HONOR rejected experimental v0.4.57 and v0.4.58 dock optics due to shimmering and jittering text through the moving backdrop. The running NavGlass.kt has been restored BYTE-FOR-BYTE to the known pre-optics v0.4.56 Haze dock renderer (source 612ba1ba); this disables all AGSL/refractive-shader use at runtime while preserving the pre-existing 56dp navigation pill, selected lens and 34dp Haze blur. Experimental NavGlassOptics.kt remains dormant in the repository for technical audit only. No changes to Tasks, Services, AMOS, Handover, profiles, persisted data, widgets, notifications or app navigation actions. Signed beta in-place upgrade to versionCode 81; source b22057ad92b0f531df12217c4ecee97150395951, main CI and publisher unit tests run in GitHub. This is intentionally NOT a new true-glass effect; HONOR scrolling/day/night validation still required. Back up profiles before updating and do not uninstall the app."
