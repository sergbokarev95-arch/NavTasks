name: Publish NavTasks Glass 0.4.40 APK
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-0.4.40-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out verified 0.4.40 AMOS completion source
        uses: actions/checkout@v4
        with:
          ref: 6c10435f7b4173349930c351001aaaf567028187
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: sdkmanager --install 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Restore stable beta signing key
        env:
          KEYSTORE_B64: ${{ secrets.NAVTASKS_BETA_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$GITHUB_WORKSPACE/navtasks-beta-sign.p12"
          test -s "$GITHUB_WORKSPACE/navtasks-beta-sign.p12"
      - name: Verify source and run regression tests
        env:
          NAVTASKS_BETA_KEYSTORE_PATH: ${{ github.workspace }}/navtasks-beta-sign.p12
          NAVTASKS_BETA_SIGN_PASSWORD: ${{ secrets.NAVTASKS_BETA_SIGN_PASSWORD }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "6c10435f7b4173349930c351001aaaf567028187"
          grep -q 'versionName = "0.4.40"' app/build.gradle.kts
          grep -q 'versionCode = 62' app/build.gradle.kts
          gradle :app:testDebugUnitTest --no-daemon
      - name: Build stable-signed debug APK
        env:
          NAVTASKS_BETA_KEYSTORE_PATH: ${{ github.workspace }}/navtasks-beta-sign.p12
          NAVTASKS_BETA_SIGN_PASSWORD: ${{ secrets.NAVTASKS_BETA_SIGN_PASSWORD }}
        run: gradle :app:assembleDebug --no-daemon
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/navtasks-beta-sign.p12"
      - name: Package compact ZIP directly from build
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          mkdir -p upload
          cp app/build/outputs/apk/debug/app-debug.apk upload/NavTasks_Glass_0.4.40_Beta.apk
          sha256sum upload/NavTasks_Glass_0.4.40_Beta.apk
          cd upload
          zip -q NavTasks_Glass_0.4.40_Build.zip NavTasks_Glass_0.4.40_Beta.apk
          unzip -t NavTasks_Glass_0.4.40_Build.zip
          cd ..
      - name: Publish 0.4.40 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v0.4.40-glass-beta \
            upload/NavTasks_Glass_0.4.40_Beta.apk \
            upload/NavTasks_Glass_0.4.40_Build.zip \
            --repo "${{ github.repository }}" \
            --target 6c10435f7b4173349930c351001aaaf567028187 \
            --prerelease \
            --title "NavTasks Glass 0.4.40 Beta · AMOS History and Completed Work" \
            --notes "Follow-up to 0.4.39: fixed AMOS History navigation after entry from Today (the history tab no longer bounces back to Open). Completed AMOS work now moves to Today's Completed stack on the selected actual completion date; recurring cycles retain the next planned date and history. Maintenance completions use the same read-only Completed behavior. AMOS list displays last actual completion and next planned execution; successfully completing a work order shows a confirmation with date. Overview counters All / Soon / Overdue are tappable filters in AMOS and Maintenance, using their existing 7-day and configurable maintenance warning rules. All recurring schedules, storage, existing histories, notifications, profile export/import and Liquid Glass geometry are unchanged. VersionCode 62. Tested in branch run 42160972086, signed main CI run 42161346548, and retested on this release job. On-device validation is still required."
