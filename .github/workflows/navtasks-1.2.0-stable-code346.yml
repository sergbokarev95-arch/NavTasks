name: NavTasks 1.2.0 STABLE UI refresh original-key release
on:
  push:
    branches:
      - release/navtasks-1.2.0-code346
    paths:
      - 'app/**'
      - '.github/workflows/navtasks-1.2.0-stable-code346.yml'
  workflow_dispatch:

concurrency:
  group: navtasks-1.2.0-stable-code346
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  stable-verified:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: sdkmanager --install 'platforms;android-36' 'platforms;android-36-ext19' 'build-tools;35.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Restore EXISTING original signing certificate
        env:
          KEYSTORE_B64: ${{ secrets.NAVTASKS_BETA_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$GITHUB_WORKSPACE/navtasks-beta-sign.p12"
          chmod 600 "$GITHUB_WORKSPACE/navtasks-beta-sign.p12"
          test -s "$GITHUB_WORKSPACE/navtasks-beta-sign.p12"
      - name: Run complete JVM tests and build stable APK
        env:
          NAVTASKS_BETA_KEYSTORE_PATH: ${{ github.workspace }}/navtasks-beta-sign.p12
          NAVTASKS_BETA_SIGN_PASSWORD: ${{ secrets.NAVTASKS_BETA_SIGN_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$NAVTASKS_BETA_SIGN_PASSWORD"
          gradle :app:testDebugUnitTest :app:assembleRelease --no-daemon
      - name: Verify package, release version, non-debuggable and original signer
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.navtasks.app.glass' versionCode='346' versionName='1.2.0'"
          ! "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -Fq 'application-debuggable'
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --min-sdk-version 31 "$APK"
          ACTUAL="$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {print $2; exit}')"
          test "$ACTUAL" = 0cb8a3c691e3fb2198682dff8c226aec710e77c7b8fded7d260a92f359a49c54
          sha256sum "$APK"
      - name: Archive verified stable APK
        uses: actions/upload-artifact@v4
        with:
          name: NavTasks_1.2.0
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 90
      - name: Publish verified stable 1.2.0 on source release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test ! -z "$GITHUB_SHA"
          LATEST_SHA="$(gh api "repos/$GITHUB_REPOSITORY/branches/release%2Fnavtasks-1.2.0-code346" --jq '.commit.sha')"
          test "$LATEST_SHA" = "$GITHUB_SHA" || {
            echo "Branch has changed since this runner started: refusing stale stable release publication."
            exit 1
          }
          if gh release view v1.2.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v1.2.0 already exists; will not overwrite immutable stable release."
            exit 1
          fi
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/NavTasks_1.2.0.apk"
          gh release create v1.2.0 "$RUNNER_TEMP/NavTasks_1.2.0.apk" \
            --repo "$GITHUB_REPOSITORY" --latest \
            --target "$GITHUB_SHA" --title "NavTasks 1.2.0" \
            --notes "NavTasks 1.2.0 — обновлённый дизайн приложения: Сегодня и календарь, редактор задач, AMOS и сервисы, Handover, профили, справочник, оборудование, мои материалы и настройки. Единые карточки, коралловые акценты, Liquid Glass, улучшенный поиск и редакторы. Онлайн-библиотека и инспекционные материалы пока в разработке. Обновление сохраняет существующие данные; рекомендуем экспорт профиля перед установкой. / NavTasks 1.2.0 — refreshed design across Today, calendar, task editor, AMOS and services, Handover, profiles, reference, equipment, My Materials and settings. Consistent cards, coral accents, Liquid Glass, improved search and editors. Online library and inspection content remain in development. In-place update; export your profile before installing."
      - name: Erase temporary signing key
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/navtasks-beta-sign.p12"
