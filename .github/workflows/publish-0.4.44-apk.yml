name: Publish NavTasks Glass 0.4.44 APK
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-0.4.44-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out verified 0.4.44 selective exchange and search source
        uses: actions/checkout@v4
        with:
          ref: fbd553e461807c40a1606af6b7226d09c96b1659
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: sdkmanager --install 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Restore stable beta signing key
        env:
          KEYSTORE_B64: ${{ secrets.NAVTASKS_BETA_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$GITHUB_WORKSPACE/navtasks-beta-sign.p12"
          test -s "$GITHUB_WORKSPACE/navtasks-beta-sign.p12"
      - name: Verify source and run regression tests
        env:
          NAVTASKS_BETA_KEYSTORE_PATH: ${{ github.workspace }}/navtasks-beta-sign.p12
          NAVTASKS_BETA_SIGN_PASSWORD: ${{ secrets.NAVTASKS_BETA_SIGN_PASSWORD }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "fbd553e461807c40a1606af6b7226d09c96b1659"
          grep -q 'versionName = "0.4.44"' app/build.gradle.kts
          grep -q 'versionCode = 66' app/build.gradle.kts
          gradle :app:testDebugUnitTest --no-daemon
      - name: Build stable-signed debug APK
        env:
          NAVTASKS_BETA_KEYSTORE_PATH: ${{ github.workspace }}/navtasks-beta-sign.p12
          NAVTASKS_BETA_SIGN_PASSWORD: ${{ secrets.NAVTASKS_BETA_SIGN_PASSWORD }}
        run: gradle :app:assembleDebug --no-daemon
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/navtasks-beta-sign.p12"
      - name: Package compact ZIP directly from build
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          mkdir -p upload
          cp app/build/outputs/apk/debug/app-debug.apk upload/NavTasks_Glass_0.4.44_Beta.apk
          sha256sum upload/NavTasks_Glass_0.4.44_Beta.apk
          cd upload
          zip -q NavTasks_Glass_0.4.44_Build.zip NavTasks_Glass_0.4.44_Beta.apk
          unzip -t NavTasks_Glass_0.4.44_Build.zip
          cd ..
      - name: Publish 0.4.44 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v0.4.44-glass-beta \
            upload/NavTasks_Glass_0.4.44_Beta.apk \
            upload/NavTasks_Glass_0.4.44_Build.zip \
            --repo "${{ github.repository }}" \
            --target fbd553e461807c40a1606af6b7226d09c96b1659 \
            --prerelease \
            --title "NavTasks Glass 0.4.44 Beta · Selective Share and Search" \
            --notes "NavTasks 0.4.44: refreshed Task list info banner; selective export and safe additive import of chosen Daily/Weekly/Monthly/One-off tasks, AMOS jobs, Service records, or Handover sections; existing completion histories and device settings are never imported by selective sharing. Added searchable AMOS and Services titles and searchable Handover content with compact Apple-style glass search UI; moved add actions into floating controls and removed redundant Handover exchange buttons. Profile labels now describe tasks, AMOS, maintenance, Handover and history; full-profile snapshots include all these shipboard records. Corrected selective AMOS duplicate identity: separately numbered jobs or unnumbered jobs on distinct schedules are not lost when sharing. This update preserves stored schema and existing records. VersionCode 66. Validated in branch CI runs 42202358881 and 42203341632, signed main CI runs 42202974785 and 42207412750, and this release job. Physical-device verification remains necessary."
