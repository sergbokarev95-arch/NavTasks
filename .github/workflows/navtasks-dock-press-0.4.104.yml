name: NavTasks 0.4.104 Beta - press and hold dock lens
on:
  push:
    branches: [feature/navtasks-dock-press-0.4.104-beta]
    paths:
      - 'app/**'
      - '.github/workflows/navtasks-dock-press-0.4.104.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: sdkmanager --install 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Restore original signed Beta key
        env:
          KEYSTORE_B64: ${{ secrets.NAVTASKS_BETA_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$GITHUB_WORKSPACE/navtasks-beta-sign.p12"
          test -s "$GITHUB_WORKSPACE/navtasks-beta-sign.p12"
      - name: Test A/B/C resources, protected behavior and full app
        env:
          NAVTASKS_BETA_KEYSTORE_PATH: ${{ github.workspace }}/navtasks-beta-sign.p12
          NAVTASKS_BETA_SIGN_PASSWORD: ${{ secrets.NAVTASKS_BETA_SIGN_PASSWORD }}
        run: |
          set -euo pipefail
          grep -Fq 'applicationIdSuffix = ".glass"' app/build.gradle.kts
          grep -Fq 'versionNameSuffix = "-beta"' app/build.gradle.kts
          grep -Fq 'versionCode = 129' app/build.gradle.kts
          grep -Fq 'versionName = "0.4.104"' app/build.gradle.kts
          grep -Fq 'smallIconForManufacturer(Build.MANUFACTURER)' app/src/main/java/com/navtasks/app/NavNotifications.kt
          test "$(git hash-object app/src/main/java/com/navtasks/app/NavLiquidDockOptics.kt)" = 'b63f59048d3798f04f4b722c5e862de4814a42ec'
          grep -Fq 'val pressedTab = tabPressed.indexOfFirst' app/src/main/java/com/navtasks/app/NavLiquidGlassDock.kt
          grep -Fq 'val target = (if (isHolding) pressedTab else selected)' app/src/main/java/com/navtasks/app/NavLiquidGlassDock.kt
          grep -Fq 'NavLiquidDockTabs.stretchTarget(moving, isHolding)' app/src/main/java/com/navtasks/app/NavLiquidGlassDock.kt
          grep -Fq 'class NavLiquidDockPressTest' app/src/test/java/com/navtasks/app/NavLiquidDockPressTest.kt
          test "$(git hash-object app/src/main/java/com/navtasks/app/NavNotifications.kt)" = 'c0ddcbe460445f16704bda0a7251b4c3f19701d6'
          test "$(git hash-object app/src/main/java/com/navtasks/app/NavLiquidGlassActionButton.kt)" = 'a551bac11ad051c1c72c68bb1030d084cacfef87'
          test "$(git hash-object app/src/main/java/com/navtasks/app/HandoverUi.kt)" = '74b3c8858bb61180a1e868430e57365526a39634'
          test "$(git hash-object app/src/main/java/com/navtasks/app/TaskStore.kt)" = 'ab422f5c07755bf1f7e1b78edbe693f675f7d12e'
          test "$(git hash-object app/src/main/java/com/navtasks/app/ServiceStore.kt)" = '9302d73141adb644f0ec8fe7210c010da7aae376'
          grep -Fq 'NavNotifications.showIconPreview(context)' app/src/main/java/com/navtasks/app/PlanAndTasksUi.kt
          grep -Fq 'setLargeIcon(Icon.createWithResource' app/src/main/java/com/navtasks/app/NavNotificationIconLab.kt
          grep -Fq 'R.drawable.navtasks_notification_adaptive' app/src/main/java/com/navtasks/app/NavNotifications.kt
          test -s app/src/main/res/drawable-anydpi-v26/navtasks_notification_adaptive.xml
          test -s app/src/main/res/drawable/navtasks_notification_adaptive_foreground.xml
          grep -Fq 'class NotificationIconDisplayTest' app/src/test/java/com/navtasks/app/NotificationIconDisplayTest.kt
          ! grep -Fq '.setLargeIcon(' app/src/main/java/com/navtasks/app/NavNotifications.kt
          grep -Fq '#0071E3' app/src/main/res/drawable/navtasks_notification_color_tile.xml
          test -s app/src/main/res/drawable/navtasks_notification_colored_small.xml
          grep -Fq 'class NotificationIconLabRulesTest' app/src/test/java/com/navtasks/app/NotificationIconLabRulesTest.kt
          gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon
      - name: Remove signing key from runner
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/navtasks-beta-sign.p12"
      - name: Verify signed APK/ZIP/identity
        run: |
          set -euo pipefail
          APK=NavTasks_Dock_Press_0.4.104_Beta.apk
          ZIP=NavTasks_Dock_Press_0.4.104_Beta_Update.zip
          test -s app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | grep -F "package: name='com.navtasks.app.glass' versionCode='129' versionName='0.4.104-beta'"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          zip -9 -X "$ZIP" "$APK"
          unzip -t "$ZIP"
          test "$(sha256sum "$APK" | cut -d ' ' -f 1)" = "$(unzip -p "$ZIP" "$APK" | sha256sum | cut -d ' ' -f 1)"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"
      - name: Publish only current commit as verified prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=v0.4.104-dock-press-verified
          CURRENT_SHA="$(gh api "repos/$GITHUB_REPOSITORY/branches/feature/navtasks-dock-press-0.4.104-beta" --jq '.commit.sha')"
          if [ "$CURRENT_SHA" != "$GITHUB_SHA" ]; then
            echo "Skipping stale commit $GITHUB_SHA; current is $CURRENT_SHA"
            exit 0
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Immutable release already exists."
          else
            gh release create "$TAG" "$ZIP" --target "$GITHUB_SHA" \
              --title "NavTasks 0.4.104 Beta - Liquid Glass dock press and hold" \
              --notes "Signed CI-verified Beta versionCode129. Selected Liquid Glass capsule expands while any tab is pressed/held (1.15x), keeps accepted 1.30x travel and shrinks to 1x matte on release; pressing an inactive tab moves lens toward finger. All navigation actions, size, dock optics, icons, tasks, AMOS, Services, notes, data, reminders unchanged. Full HONOR physical acceptance pending. Export FULL profiles and install in-place without uninstall." \
              --prerelease
          fi
