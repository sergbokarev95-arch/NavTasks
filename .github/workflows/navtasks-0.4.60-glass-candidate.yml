name: Candidate NavTasks 0.4.60 Beta - exact Glass Lab 0.1.5 in place

on:
  push:
    branches:
      - feature/navtasks-liquid-glass-0.4.60-candidate
    paths:
      - 'app/**'
      - 'settings.gradle.kts'
      - '.github/workflows/navtasks-0.4.60-glass-candidate.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: sdkmanager --install 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Restore stable Beta signing key
        env:
          KEYSTORE_B64: ${{ secrets.NAVTASKS_BETA_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$GITHUB_WORKSPACE/navtasks-beta-sign.p12"
          test -s "$GITHUB_WORKSPACE/navtasks-beta-sign.p12"
      - name: Verify exact Lab optics and run full app regression suite
        env:
          NAVTASKS_BETA_KEYSTORE_PATH: ${{ github.workspace }}/navtasks-beta-sign.p12
          NAVTASKS_BETA_SIGN_PASSWORD: ${{ secrets.NAVTASKS_BETA_SIGN_PASSWORD }}
        run: |
          set -euo pipefail
          # The candidate deliberately updates the stable Beta app IN PLACE; preserve package and signing.
          grep -Fq 'applicationIdSuffix = ".glass"' app/build.gradle.kts
          grep -Fq 'versionNameSuffix = "-beta"' app/build.gradle.kts
          grep -Fq 'versionName = "0.4.60"' app/build.gradle.kts
          grep -Fq 'versionCode = 83' app/build.gradle.kts
          grep -Fq 'blurDp = 2.0f' app/src/main/java/com/navtasks/app/NavLiquidDockOptics.kt
          grep -Fq 'blurDp = 1.5f' app/src/main/java/com/navtasks/app/NavLiquidDockOptics.kt
          grep -Fq 'implementation("io.github.kyant0:backdrop:1.0.6")' app/build.gradle.kts
          grep -Fq 'implementation("io.github.kyant0:shapes:1.2.0")' app/build.gradle.kts
          grep -Fq 'Box(Modifier.matchParentSize().then(backing).then(opticalEdge))' app/src/main/java/com/navtasks/app/NavLiquidGlassDock.kt
          grep -Fq 'BoxWithConstraints(modifier.fillMaxWidth().height(56.dp))' app/src/main/java/com/navtasks/app/NavLiquidGlassDock.kt
          grep -Fq '.padding(horizontal = 15.dp, vertical = 8.dp)' app/src/main/java/com/navtasks/app/NavTasksUi.kt
          test "$(git hash-object app/src/main/java/com/navtasks/app/NavGlass.kt)" = "80c0a8aef011ac9212a1516e7e74071a9290ddad"
          grep -Fq 'NavGlassCalendarButton(palette, hazeState)' app/src/main/java/com/navtasks/app/NavTasksUi.kt
          grep -Fq 'Modifier.layerBackdrop(glassBackdrop)' app/src/main/java/com/navtasks/app/NavTasksUi.kt
          grep -Fq 'NavGlassBottomBar(' app/src/main/java/com/navtasks/app/NavTasksUi.kt
          gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon
      - name: Destroy temporary signing key
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/navtasks-beta-sign.p12"
      - name: Verify same-package signed update candidate APK
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk NavTasks_Glass_0.4.60_ExactLab_Beta.apk
          sha256sum NavTasks_Glass_0.4.60_ExactLab_Beta.apk
      - uses: actions/upload-artifact@v4
        with:
          name: NavTasks-Glass-0.4.60-ExactLab-Beta
          path: NavTasks_Glass_0.4.60_ExactLab_Beta.apk
          if-no-files-found: error
          retention-days: 60
      - name: Publish separate prerelease (not production)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v0.4.60-exactlab-candidate"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" NavTasks_Glass_0.4.60_ExactLab_Beta.apk --clobber
          else
            gh release create "$TAG" NavTasks_Glass_0.4.60_ExactLab_Beta.apk \
              --target "$GITHUB_SHA" \
              --title "NavTasks 0.4.60 Beta Candidate - exact Glass Lab 0.1.5 optics" \
              --notes "IN-PLACE BETA UPDATE CANDIDATE, same app ID com.navtasks.app.glass and same beta signing key as installed NavTasks 0.4.59; DO NOT uninstall. Export a complete profile backup before installing. VersionCode 83/versionName 0.4.60-beta. Exact optically accepted Glass Lab 0.1.5 code transplanted: Backdrop 1.0.6, outer blur 2dp/selection 1.5dp, lens 12/36dp and 10/18dp, uniform 1.30x moving selected capsule with uncut top/bottom overhang and grey rest. Only binding to existing NavTasks tabs/palette/labels and original scene; app data/Tasks/Services/AMOS/Handover/notifications logic untouched, legacy Haze dock fallback API31/32 intact. Due to differing card backgrounds, appearance may differ visually from lab's colorful demo. HONOR device acceptance required before promoting to stable main." \
              --prerelease
          fi
