name: Publish NavTasks Glass 0.4.39 APK
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-0.4.39-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out verified 0.4.39 UI audit source
        uses: actions/checkout@v4
        with:
          ref: 2168ec988c680bb36ca999a80897c76c86c7e66e
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: sdkmanager --install 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Restore stable beta signing key
        env:
          KEYSTORE_B64: ${{ secrets.NAVTASKS_BETA_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$GITHUB_WORKSPACE/navtasks-beta-sign.p12"
          test -s "$GITHUB_WORKSPACE/navtasks-beta-sign.p12"
      - name: Verify source and run regression tests
        env:
          NAVTASKS_BETA_KEYSTORE_PATH: ${{ github.workspace }}/navtasks-beta-sign.p12
          NAVTASKS_BETA_SIGN_PASSWORD: ${{ secrets.NAVTASKS_BETA_SIGN_PASSWORD }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "2168ec988c680bb36ca999a80897c76c86c7e66e"
          grep -q 'versionName = "0.4.39"' app/build.gradle.kts
          grep -q 'versionCode = 61' app/build.gradle.kts
          gradle :app:testDebugUnitTest --no-daemon
      - name: Build stable-signed debug APK
        env:
          NAVTASKS_BETA_KEYSTORE_PATH: ${{ github.workspace }}/navtasks-beta-sign.p12
          NAVTASKS_BETA_SIGN_PASSWORD: ${{ secrets.NAVTASKS_BETA_SIGN_PASSWORD }}
        run: gradle :app:assembleDebug --no-daemon
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/navtasks-beta-sign.p12"
      - name: Package compact ZIP directly from build
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          mkdir -p upload
          cp app/build/outputs/apk/debug/app-debug.apk upload/NavTasks_Glass_0.4.39_Beta.apk
          sha256sum upload/NavTasks_Glass_0.4.39_Beta.apk
          cd upload
          zip -q NavTasks_Glass_0.4.39_Build.zip NavTasks_Glass_0.4.39_Beta.apk
          unzip -t NavTasks_Glass_0.4.39_Build.zip
          cd ..
      - name: Publish 0.4.39 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v0.4.39-glass-beta \
            upload/NavTasks_Glass_0.4.39_Beta.apk \
            upload/NavTasks_Glass_0.4.39_Build.zip \
            --repo "${{ github.repository }}" \
            --target 2168ec988c680bb36ca999a80897c76c86c7e66e \
            --prerelease \
            --title "NavTasks Glass 0.4.39 Beta · UI Consistency Audit" \
            --notes "UI-only audit and refinements: contrast-aware Day/Night status colors; subtle primary/secondary Day text contrast corrections; 44dp interactive targets for checklists, AMOS/Services and menus; responsive Work Order and maintenance action rows; consistent vector menu/check/edit/calendar navigation icons; unified profile inputs, Handover details and calendar menu styles. Dock size, Haze blur and animated glass lens remain unchanged. No changes to Task, AMOS, Service or Handover storage, scheduling, notifications or import/export logic. VersionCode 61. Tested in branch CI runs 42080254318 and 42080771230, main signed CI run 42081239731, and retested in this publish job. Device day/night and gesture verification still required."
