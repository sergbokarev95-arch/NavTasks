name: NavTasks Glass UX - controls, settings footer, quick profiles
on:
  push:
    branches: [feature/liquid-glass-controls-quick-profiles-preview]
    paths:
      - 'app/**'
      - '.github/workflows/glass-ux-preview.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: sdkmanager --install 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Restore stable Beta signing key for isolated test app
        env:
          KEYSTORE_B64: ${{ secrets.NAVTASKS_BETA_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$GITHUB_WORKSPACE/navtasks-beta-sign.p12"
          test -s "$GITHUB_WORKSPACE/navtasks-beta-sign.p12"
      - name: Validate isolation, unchanged approved material and unit tests
        env:
          NAVTASKS_BETA_KEYSTORE_PATH: ${{ github.workspace }}/navtasks-beta-sign.p12
          NAVTASKS_BETA_SIGN_PASSWORD: ${{ secrets.NAVTASKS_BETA_SIGN_PASSWORD }}
        run: |
          set -euo pipefail
          grep -Fq 'applicationIdSuffix = ".glassux"' app/build.gradle.kts
          grep -Fq 'versionNameSuffix = "-controls-preview1"' app/build.gradle.kts
          test "$(git hash-object app/src/main/java/com/navtasks/app/NavSolidCardTokens.kt)" = 'ee7c0f4388164d05490f89a2e63ae461fc9dfbf8'
          test "$(git hash-object app/src/main/java/com/navtasks/app/NavLiquidGlassDock.kt)" = '53e713f4272f7be6db75e3cfdb65b22d5f55b702'
          test "$(git hash-object app/src/main/java/com/navtasks/app/NavLiquidDockOptics.kt)" = 'b63f59048d3798f04f4b722c5e862de4814a42ec'
          grep -Fq 'NavQuickProfilePicker(' app/src/main/java/com/navtasks/app/NavTasksUi.kt
          grep -Fq 'NavLiquidGlassActionButton(' app/src/main/java/com/navtasks/app/NavTasksUi.kt
          grep -Fq 'Spacer(Modifier.windowInsetsBottomHeight(WindowInsets.navigationBars))' app/src/main/java/com/navtasks/app/PlanAndTasksUi.kt
          gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon
      - name: Remove temporary signing material
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/navtasks-beta-sign.p12"
      - name: Verify separate Android app and produce compressed ZIP
        run: |
          set -euo pipefail
          APK=NavTasks_Glass_UX_Preview1.apk
          ZIP=NavTasks_Glass_UX_Preview1.zip
          test -s app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | grep -F "package: name='com.navtasks.app.glassux'"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          zip -9 -X "$ZIP" "$APK"
          unzip -t "$ZIP"
          test "$(sha256sum "$APK" | cut -d ' ' -f 1)" = "$(unzip -p "$ZIP" "$APK" | sha256sum | cut -d ' ' -f 1)"
          echo "ZIP bytes: $(stat -c %s "$ZIP")"
          sha256sum "$ZIP"
      # Actions artifact storage is full: use GitHub Releases directly.
      - name: Publish isolated UX preview prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=glassux-preview1
          ZIP=NavTasks_Glass_UX_Preview1.zip
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" --clobber
          else
            gh release create "$TAG" "$ZIP" --target "$GITHUB_SHA" \
              --title "NavTasks Glass UX Preview 1 - Pinch Profiles + Liquid Glass Actions" \
              --notes "ISOLATED TEST APP com.navtasks.app.glassux; DOES NOT REPLACE installed NavTasks nor share user profiles. Contains the already approved opaque gradient cards and optical 56dp dock unchanged. First button stage: same direct-scene Liquid Glass for floating + and Calendar, Haze fallback on older API. Settings bottom no longer reserves a cut-off navigation footer; safe last-card scroll padding inside list. Deliberate two-finger pinch on regular app screens opens centered Quick Profiles panel with blurred background; tap profile uses exact existing ProfileStore selection and Task/Handover/Services/AMOS refresh. Pinch disabled in editor, calendar and management pages; no one-finger swipe changes. Real HONOR device acceptance pending. ZIP contains signed APK; unpack and install separately. To test switching, create two test profiles or import a COPY of an exported profile." \
              --prerelease
          fi
