name: Publish NavTasks Glass 0.4.41 APK
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-0.4.41-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out verified 0.4.41 Closed and per-work history source
        uses: actions/checkout@v4
        with:
          ref: 11fbd73ecc43880060ddab8ec600aceeda2450bf
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: sdkmanager --install 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Restore stable beta signing key
        env:
          KEYSTORE_B64: ${{ secrets.NAVTASKS_BETA_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$GITHUB_WORKSPACE/navtasks-beta-sign.p12"
          test -s "$GITHUB_WORKSPACE/navtasks-beta-sign.p12"
      - name: Verify source and run regression tests
        env:
          NAVTASKS_BETA_KEYSTORE_PATH: ${{ github.workspace }}/navtasks-beta-sign.p12
          NAVTASKS_BETA_SIGN_PASSWORD: ${{ secrets.NAVTASKS_BETA_SIGN_PASSWORD }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "11fbd73ecc43880060ddab8ec600aceeda2450bf"
          grep -q 'versionName = "0.4.41"' app/build.gradle.kts
          grep -q 'versionCode = 63' app/build.gradle.kts
          gradle :app:testDebugUnitTest --no-daemon
      - name: Build stable-signed debug APK
        env:
          NAVTASKS_BETA_KEYSTORE_PATH: ${{ github.workspace }}/navtasks-beta-sign.p12
          NAVTASKS_BETA_SIGN_PASSWORD: ${{ secrets.NAVTASKS_BETA_SIGN_PASSWORD }}
        run: gradle :app:assembleDebug --no-daemon
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/navtasks-beta-sign.p12"
      - name: Package compact ZIP directly from build
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          mkdir -p upload
          cp app/build/outputs/apk/debug/app-debug.apk upload/NavTasks_Glass_0.4.41_Beta.apk
          sha256sum upload/NavTasks_Glass_0.4.41_Beta.apk
          cd upload
          zip -q NavTasks_Glass_0.4.41_Build.zip NavTasks_Glass_0.4.41_Beta.apk
          unzip -t NavTasks_Glass_0.4.41_Build.zip
          cd ..
      - name: Publish 0.4.41 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v0.4.41-glass-beta \
            upload/NavTasks_Glass_0.4.41_Beta.apk \
            upload/NavTasks_Glass_0.4.41_Build.zip \
            --repo "${{ github.repository }}" \
            --target 11fbd73ecc43880060ddab8ec600aceeda2450bf \
            --prerelease \
            --title "NavTasks Glass 0.4.41 Beta · Per-work History and Closed" \
            --notes "NavTasks 0.4.41: each AMOS Work Order card and maintenance equipment card opens its own local execution history; editing is only via the explicit Edit button. AMOS no longer has a mixed global History list; it now has Work and Closed tabs. Maintenance adds the same Work and Closed tabs. The first Delete moves a record to Closed without erasing schedule, checklist, AMOS references or history. Closed records can be restored, or permanently deleted only after a separate explicit confirmation. Completed one-off AMOS work remains accessible in Work and can still be reopened. Closed records no longer appear in Today, Calendar, overview filters or Works hub counters. Stored JSON profile export/import automatically includes the backward-compatible closedAt field, absent in older data. Task completion, recurrence schedules, notifications, glass/dock and unrelated functions are unchanged. VersionCode 63. Verified by branch test/build run 42164610147 and signed main CI run 42164935091. Retested and rebuilt in release workflow. On-device validation is still required."
