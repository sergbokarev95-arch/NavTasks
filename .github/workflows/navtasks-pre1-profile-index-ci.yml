name: NavTasks pre-1.0.0 — profile index integrity recovery QA

on:
  push:
    branches:
      - feature/navtasks-pre1-profile-index-recovery
    paths:
      - 'app/src/test/java/com/navtasks/app/NavProfileIndexRecoveryTest.kt'
      - 'docs/development/PROFILE_INDEX_SAFETY.md'
      - '.github/workflows/navtasks-pre1-profile-index-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  accepted-baseline-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install exact Android toolchain
        run: sdkmanager --install 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Verify strictly isolated index-safety change from user-accepted TEST3
        shell: bash
        run: |
          set -euo pipefail
          BASE=cd63c8325ac0e89e251c056597584a587a9f9e42
          git diff --name-only "$BASE" "$GITHUB_SHA" > changed.txt
          if grep -Ev '^(app/src/main/java/com/navtasks/app/ProfileStore\.kt|app/src/test/java/com/navtasks/app/NavProfileIndexRecoveryTest\.kt|docs/development/PROFILE_INDEX_SAFETY\.md|\.github/workflows/navtasks-pre1-profile-index-ci\.yml)$' changed.txt; then
            echo "::error::App logic, profile stores, manifest or dock changed during read-only preflight"
            exit 1
          fi
          grep -Fq 'versionCode = 184' app/build.gradle.kts
          grep -Fq 'versionName = "0.4.162"' app/build.gradle.kts
          grep -Fq 'versionNameSuffix = "-test3"' app/build.gradle.kts
          grep -Fq 'applicationIdSuffix = ".glass"' app/build.gradle.kts
          grep -Fq 'isDebuggable = false' app/build.gradle.kts
          test -f app/src/test/java/com/navtasks/app/NavProfileIndexRecoveryTest.kt
      - name: Restore ONLY existing signed NavTasks key
        env:
          KEYSTORE_B64: ${{ secrets.NAVTASKS_BETA_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$GITHUB_WORKSPACE/navtasks-beta-sign.p12"
          chmod 600 "$GITHUB_WORKSPACE/navtasks-beta-sign.p12"
          test -s "$GITHUB_WORKSPACE/navtasks-beta-sign.p12"
      - name: All JVM regressions plus signed APK assembly (NO PUBLISH)
        env:
          NAVTASKS_BETA_KEYSTORE_PATH: ${{ github.workspace }}/navtasks-beta-sign.p12
          NAVTASKS_BETA_SIGN_PASSWORD: ${{ secrets.NAVTASKS_BETA_SIGN_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$NAVTASKS_BETA_SIGN_PASSWORD"
          gradle :app:testDebugUnitTest :app:assembleRelease --no-daemon
      - name: Verify exact installed identity, signer, and nondebuggable APK
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          SIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$AAPT" dump badging "$APK" | grep -F "package: name='com.navtasks.app.glass' versionCode='184' versionName='0.4.162-test3'"
          "$AAPT" dump badging "$APK" | grep -F "sdkVersion:'31'"
          ! "$AAPT" dump badging "$APK" | grep -Fq 'application-debuggable'
          "$SIGNER" verify --min-sdk-version 31 "$APK"
          ACTUAL="$("$SIGNER" verify --print-certs "$APK" | awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {print $2; exit}')"
          EXPECTED=0cb8a3c691e3fb2198682dff8c226aec710e77c7b8fded7d260a92f359a49c54
          test "$ACTUAL" = "$EXPECTED"
      - name: Verify public TEST only and STABLE remains OFF (read-only)
        shell: bash
        run: |
          set -euo pipefail
          BASE=https://raw.githubusercontent.com/sergbokarev95-arch/NavTasks-Updates/main/channels
          curl -fLSs --retry 2 --max-time 30 "$BASE/stable.json" > stable.json
          curl -fLSs --retry 2 --max-time 30 "$BASE/test.json" > test.json
          python3 - <<'PY'
          import json
          stable=json.load(open('stable.json'))
          assert stable=={'schemaVersion':1,'channel':'stable','available':False}, stable
          test=json.load(open('test.json'))
          assert test['channel']=='test' and test['available'] is True
          assert test['versionCode']>=184 and test['minSupportedVersionCode']>=182
          assert test['applicationId']=='com.navtasks.app.glass'
          assert test['apk']['signerSha256']=='0cb8a3c691e3fb2198682dff8c226aec710e77c7b8fded7d260a92f359a49c54'
          print('TEST3 code184 profile index QA-only build validated. NO release and NO feed mutation.')
          PY
