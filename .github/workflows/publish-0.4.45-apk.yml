name: Publish NavTasks Glass 0.4.45 APK
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-0.4.45-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out pinned 0.4.45 notification and widget fixes
        uses: actions/checkout@v4
        with:
          ref: 0e4ec8ef38e4bf24fbe8c3cba0c69393cfe4384a
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: sdkmanager --install 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Restore stable beta signing key
        env:
          KEYSTORE_B64: ${{ secrets.NAVTASKS_BETA_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$GITHUB_WORKSPACE/navtasks-beta-sign.p12"
          test -s "$GITHUB_WORKSPACE/navtasks-beta-sign.p12"
      - name: Verify source and run regression tests
        env:
          NAVTASKS_BETA_KEYSTORE_PATH: ${{ github.workspace }}/navtasks-beta-sign.p12
          NAVTASKS_BETA_SIGN_PASSWORD: ${{ secrets.NAVTASKS_BETA_SIGN_PASSWORD }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "0e4ec8ef38e4bf24fbe8c3cba0c69393cfe4384a"
          grep -q 'versionName = "0.4.45"' app/build.gradle.kts
          grep -q 'versionCode = 67' app/build.gradle.kts
          gradle :app:testDebugUnitTest --no-daemon
      - name: Build stable-signed debug APK
        env:
          NAVTASKS_BETA_KEYSTORE_PATH: ${{ github.workspace }}/navtasks-beta-sign.p12
          NAVTASKS_BETA_SIGN_PASSWORD: ${{ secrets.NAVTASKS_BETA_SIGN_PASSWORD }}
        run: gradle :app:assembleDebug --no-daemon
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/navtasks-beta-sign.p12"
      - name: Package compact ZIP directly from build
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          mkdir -p upload
          cp app/build/outputs/apk/debug/app-debug.apk upload/NavTasks_Glass_0.4.45_Beta.apk
          sha256sum upload/NavTasks_Glass_0.4.45_Beta.apk
          cd upload
          zip -q NavTasks_Glass_0.4.45_Build.zip NavTasks_Glass_0.4.45_Beta.apk
          unzip -t NavTasks_Glass_0.4.45_Build.zip
          cd ..
      - name: Publish 0.4.45 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v0.4.45-glass-beta \
            upload/NavTasks_Glass_0.4.45_Beta.apk \
            upload/NavTasks_Glass_0.4.45_Build.zip \
            --repo "${{ github.repository }}" \
            --target 0e4ec8ef38e4bf24fbe8c3cba0c69393cfe4384a \
            --prerelease \
            --title "NavTasks Glass 0.4.45 Beta · Notifications and Widgets" \
            --notes "NavTasks 0.4.45: dedicated crisp high-contrast small notification icon on Android/HONOR; redesigned compact and wide home widgets with translucent neutral surfaces, tighter grouped task rows, responsive 1-4 visible tasks according to widget height, clear remaining/missed counters and direct simple-task completion or checklist opening. Adds widget refresh on resize. Existing profile and task data unchanged. Signed with the same stable beta key; versionCode 67. Device verification of widgets and launcher icon appearance recommended."
