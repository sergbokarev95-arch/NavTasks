name: Publish NavTasks Glass 0.4.37 APK
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-0.4.37-apk.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify tested source and download signed APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN=42069404091
          REPO="${{ github.repository }}"
          EXPECTED_SHA="894976ef755f221f0b3f04eb595cbb470cd976a4"
          test "$(gh run view "$RUN" --repo "$REPO" --json conclusion --jq .conclusion)" = success
          test "$(gh run view "$RUN" --repo "$REPO" --json headSha --jq .headSha)" = "$EXPECTED_SHA"
          mkdir -p upload
          gh run download "$RUN" --repo "$REPO" \
            --name NavTasks-Glass-0.2.6-debug-apk --dir upload
          test -s upload/app-debug.apk
          sha256sum upload/app-debug.apk
          mv upload/app-debug.apk upload/NavTasks_Glass_0.4.37_Beta.apk
          cd upload
          zip -q NavTasks_Glass_0.4.37_Build.zip NavTasks_Glass_0.4.37_Beta.apk
          unzip -t NavTasks_Glass_0.4.37_Build.zip
          cd ..

      - name: Publish version 0.4.37
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v0.4.37-glass-beta \
            upload/NavTasks_Glass_0.4.37_Beta.apk \
            upload/NavTasks_Glass_0.4.37_Build.zip \
            --repo "${{ github.repository }}" \
            --target 894976ef755f221f0b3f04eb595cbb470cd976a4 \
            --prerelease \
            --title "NavTasks Glass 0.4.37 Beta · Faster Dock Swipes" \
            --notes "Removed redundant Work shortcut tile from Tasks; Work is already in dock. Dock swipes now activate during a deliberate 48dp horizontal drag, without waiting for release. Preserve priority for vertical scrolling, Today's 7-day LazyRow and system edge back. No change to dock glass animation or stored Tasks, AMOS, Services or Handover data. versionCode 59 / versionName 0.4.37. Unit tests and signed debug APK build succeeded in GitHub Actions run 42069404091. On-device gesture behavior still requires user verification."
