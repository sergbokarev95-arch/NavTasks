name: NavTasks 0.4.150 RC7 Fix1 — signed in-app updater validation (PRIVATE)

on:
  push:
    branches:
      - feature/navtasks-updater-0.4.150-rc7-fix1-code175
    paths:
      - 'app/**'
      - 'docs/development/UPDATER_TEST_WEAKNET_CODE175.md'
      - '.github/workflows/navtasks-updater-test-weaknet-code175.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK build tools
        run: sdkmanager --install 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Restore ONLY the existing NavTasks signing key
        env:
          KEYSTORE_B64: ${{ secrets.NAVTASKS_BETA_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$GITHUB_WORKSPACE/navtasks-beta-sign.p12"
          chmod 600 "$GITHUB_WORKSPACE/navtasks-beta-sign.p12"
          test -s "$GITHUB_WORKSPACE/navtasks-beta-sign.p12"
      - name: Enforce surgical changes and update permissions
        shell: bash
        run: |
          set -euo pipefail
          BASE=536fd3c1608456e029617787cd9be9c9d9a4e39d
          git diff --name-only "$BASE" "$GITHUB_SHA" > changed.txt
          if grep -Ev '^(app/src/main/java/com/navtasks/app/(NavUpdateChecker|NavTestFeedNetwork|PlanAndTasksUi)\.kt|app/build\.gradle\.kts|app/src/test/java/com/navtasks/app/(NavTestFeedNetworkPolicyTest|NavTestUpdateFeedTest)\.kt|\.github/workflows/navtasks-updater-test-weaknet-code175\.yml|docs/development/UPDATER_TEST_WEAKNET_CODE175\.md)
            echo "::error::Unapproved business/store/Glass source modification"
            exit 1
          fi
          grep -Fq 'versionCode = 175' app/build.gradle.kts
          grep -Fq 'versionName = "0.4.150"' app/build.gradle.kts
          grep -Fq 'versionNameSuffix = "-rc7-fix1"' app/build.gradle.kts
          grep -Fq 'isDebuggable = false' app/build.gradle.kts
          grep -Fq 'applicationIdSuffix = ".glass"' app/build.gradle.kts
          grep -Fq 'android.permission.REQUEST_INSTALL_PACKAGES' app/src/main/AndroidManifest.xml
          grep -Fq 'android:authorities="' app/src/main/AndroidManifest.xml
          grep -Fq 'android:exported="false"' app/src/main/AndroidManifest.xml
          grep -Fq 'path="navtasks-update/"' app/src/main/res/xml/navtasks_update_paths.xml
          grep -Fq 'class NavUpdateInstallerPolicyTest' app/src/test/java/com/navtasks/app/NavUpdateInstallerPolicyTest.kt
          grep -Fq 'MessageDigest.isEqual(installedDigest, archiveDigest)' app/src/main/java/com/navtasks/app/NavUpdateInstaller.kt
          grep -Fq 'NavUpdateChecker.defer(context, update.versionCode)' app/src/main/java/com/navtasks/app/NavUpdateOffer.kt
          grep -Fq 'val body = NavTestFeedNetwork.read()' app/src/main/java/com/navtasks/app/NavUpdateChecker.kt
          grep -Fq 'lastManualMessage = navTestFeedErrorCode(error)' app/src/main/java/com/navtasks/app/NavUpdateChecker.kt
          grep -Fq 'readTimeout = 20_000' app/src/main/java/com/navtasks/app/NavTestFeedNetwork.kt
          grep -Fq 'connectTimeout = 12_000' app/src/main/java/com/navtasks/app/NavTestFeedNetwork.kt
          test -f app/src/test/java/com/navtasks/app/NavTestFeedNetworkPolicyTest.kt
          grep -Fq 'NavTestFeedNetwork.read()' app/src/test/java/com/navtasks/app/NavTestUpdateFeedTest.kt
          grep -Fq 'if (!testChannel) NavUpdateChecker.defer(context, update.versionCode)' app/src/main/java/com/navtasks/app/NavUpdateOffer.kt
          test -f app/src/test/java/com/navtasks/app/NavTestUpdateFeedTest.kt
          grep -Fq 'NavSettings(appContext).automaticUpdateOffers' app/src/main/java/com/navtasks/app/NavUpdateChecker.kt
          test -f app/src/test/java/com/navtasks/app/NavTestUpdateFeedTest.kt
      - name: Test and build signed nondebuggable release APK
        env:
          NAVTASKS_BETA_KEYSTORE_PATH: ${{ github.workspace }}/navtasks-beta-sign.p12
          NAVTASKS_BETA_SIGN_PASSWORD: ${{ secrets.NAVTASKS_BETA_SIGN_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$NAVTASKS_BETA_SIGN_PASSWORD"
          gradle :app:testDebugUnitTest :app:assembleRelease --no-daemon
      - name: Verify signed APK and historical signer compatibility
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK='app/build/outputs/apk/release/app-release.apk'
          test -s "$APK"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          SIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$AAPT" dump badging "$APK" | grep -F "package: name='com.navtasks.app.glass' versionCode='175' versionName='0.4.150-rc7-fix1'"
          "$AAPT" dump badging "$APK" | grep -F "sdkVersion:'31'"
          ! "$AAPT" dump badging "$APK" | grep -Fq 'application-debuggable'
          "$SIGNER" verify --min-sdk-version 31 "$APK"
          cert_digest() {
            "$SIGNER" verify --print-certs "$1" | awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {print $2; exit}'
          }
          CURRENT_CERT="$(cert_digest "$APK")"
          test -n "$CURRENT_CERT"
          mkdir -p "$RUNNER_TEMP/navtasks-baselines"
          for item in \
            'v0.4.118-notification-widget-verified|NavTasks_Reliability_0.4.118_Beta_Update.zip|143' \
            'v0.4.140-personal-search-fix-verified|NavTasks_Personal_Search_Fix_0.4.140_Beta_Update.zip|165'; do
            IFS='|' read -r TAG ZIP CODE <<< "$item"
            DIR="$RUNNER_TEMP/navtasks-baselines/$CODE"
            mkdir -p "$DIR"
            gh release download "$TAG" --pattern "$ZIP" --repo "$GITHUB_REPOSITORY" --dir "$DIR"
            test -s "$DIR/$ZIP"
            test "$(unzip -Z1 "$DIR/$ZIP" | grep -Ec '\.apk$')" -eq 1
            ENTRY="$(unzip -Z1 "$DIR/$ZIP" | grep -E '\.apk$')"
            unzip -p "$DIR/$ZIP" "$ENTRY" > "$DIR/baseline.apk"
            "$AAPT" dump badging "$DIR/baseline.apk" | grep -F "package: name='com.navtasks.app.glass' versionCode='$CODE'"
            "$SIGNER" verify --min-sdk-version 31 "$DIR/baseline.apk"
            test "$CURRENT_CERT" = "$(cert_digest "$DIR/baseline.apk")"
            test 175 -gt "$CODE"
          done
          mkdir -p dist
          cp "$APK" dist/NavTasks_0.4.150_RC7_Fix1_WeakNet_Private.apk
          (cd dist && sha256sum NavTasks_0.4.150_RC7_Fix1_WeakNet_Private.apk > NavTasks_0.4.150_RC7_Fix1_WeakNet_Private.apk.sha256)
          (cd dist && sha256sum -c NavTasks_0.4.150_RC7_Fix1_WeakNet_Private.apk.sha256)
          echo "CI verified the APK is signed; physical in-app installation remains untested."
      - name: Delete temporary signing key
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/navtasks-beta-sign.p12"
      - name: Publish only PRIVATE draft RC; NEVER advertise as stable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='v0.4.150-rc7-fix1-code175-private'
          SOURCE="$(gh api "repos/$GITHUB_REPOSITORY/branches/feature/navtasks-updater-0.4.150-rc7-fix1-code175" --jq '.commit.sha')"
          if [ "$SOURCE" != "$GITHUB_SHA" ]; then
            echo "::error::Outdated run must not publish"
            exit 1
          fi
          DRAFT_ID="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(.tag_name == "v0.4.150-rc7-fix1-code175-private" and .draft == true) | .id')"
          if [ -n "$DRAFT_ID" ]; then
            echo "Existing private draft $DRAFT_ID remains untouched"
          else
            gh release create "$TAG" \
              dist/NavTasks_0.4.150_RC7_Fix1_WeakNet_Private.apk \
              dist/NavTasks_0.4.150_RC7_Fix1_WeakNet_Private.apk.sha256 \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "NavTasks 0.4.150 RC7 Fix1 · in-app installer PRIVATE QA" \
              --notes "PRIVATE DRAFT RC7 Fix1/code175; never stable update feed. Exact RC7/code174 feature base, test channel code176 remains compatible. Same installed package and signing cert as older Betas. Optional updater includes download progress, SHA+installed signing certificate checks, explicit installer action and unknown-source permission handling. Public stable channel remains available:false. CI only; test channel remains manual-only and publicly published as a separate test prerelease; HONOR testing pending. Never uninstall/clear data. Exact RC7 code177 signed recovery already exists. Never uninstall; no public stable changes." \
              --draft --prerelease
          fi
 changed.txt; then
            echo "::error::Unapproved business/store/Glass source modification"
            exit 1
          fi
          grep -Fq 'versionCode = 175' app/build.gradle.kts
          grep -Fq 'versionName = "0.4.150"' app/build.gradle.kts
          grep -Fq 'versionNameSuffix = "-rc7-fix1"' app/build.gradle.kts
          grep -Fq 'isDebuggable = false' app/build.gradle.kts
          grep -Fq 'applicationIdSuffix = ".glass"' app/build.gradle.kts
          grep -Fq 'android.permission.REQUEST_INSTALL_PACKAGES' app/src/main/AndroidManifest.xml
          grep -Fq 'android:authorities="' app/src/main/AndroidManifest.xml
          grep -Fq 'android:exported="false"' app/src/main/AndroidManifest.xml
          grep -Fq 'path="navtasks-update/"' app/src/main/res/xml/navtasks_update_paths.xml
          grep -Fq 'class NavUpdateInstallerPolicyTest' app/src/test/java/com/navtasks/app/NavUpdateInstallerPolicyTest.kt
          grep -Fq 'MessageDigest.isEqual(installedDigest, archiveDigest)' app/src/main/java/com/navtasks/app/NavUpdateInstaller.kt
          grep -Fq 'NavUpdateChecker.defer(context, update.versionCode)' app/src/main/java/com/navtasks/app/NavUpdateOffer.kt
          grep -Fq 'val body = NavTestFeedNetwork.read()' app/src/main/java/com/navtasks/app/NavUpdateChecker.kt
          grep -Fq 'lastManualMessage = navTestFeedErrorCode(error)' app/src/main/java/com/navtasks/app/NavUpdateChecker.kt
          grep -Fq 'readTimeout = 20_000' app/src/main/java/com/navtasks/app/NavTestFeedNetwork.kt
          grep -Fq 'connectTimeout = 12_000' app/src/main/java/com/navtasks/app/NavTestFeedNetwork.kt
          test -f app/src/test/java/com/navtasks/app/NavTestFeedNetworkPolicyTest.kt
          grep -Fq 'if (!testChannel) NavUpdateChecker.defer(context, update.versionCode)' app/src/main/java/com/navtasks/app/NavUpdateOffer.kt
          test -f app/src/test/java/com/navtasks/app/NavTestUpdateFeedTest.kt
          grep -Fq 'NavSettings(appContext).automaticUpdateOffers' app/src/main/java/com/navtasks/app/NavUpdateChecker.kt
          test -f app/src/test/java/com/navtasks/app/NavTestUpdateFeedTest.kt
      - name: Test and build signed nondebuggable release APK
        env:
          NAVTASKS_BETA_KEYSTORE_PATH: ${{ github.workspace }}/navtasks-beta-sign.p12
          NAVTASKS_BETA_SIGN_PASSWORD: ${{ secrets.NAVTASKS_BETA_SIGN_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$NAVTASKS_BETA_SIGN_PASSWORD"
          gradle :app:testDebugUnitTest :app:assembleRelease --no-daemon
      - name: Verify signed APK and historical signer compatibility
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK='app/build/outputs/apk/release/app-release.apk'
          test -s "$APK"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          SIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$AAPT" dump badging "$APK" | grep -F "package: name='com.navtasks.app.glass' versionCode='175' versionName='0.4.150-rc7-fix1'"
          "$AAPT" dump badging "$APK" | grep -F "sdkVersion:'31'"
          ! "$AAPT" dump badging "$APK" | grep -Fq 'application-debuggable'
          "$SIGNER" verify --min-sdk-version 31 "$APK"
          cert_digest() {
            "$SIGNER" verify --print-certs "$1" | awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {print $2; exit}'
          }
          CURRENT_CERT="$(cert_digest "$APK")"
          test -n "$CURRENT_CERT"
          mkdir -p "$RUNNER_TEMP/navtasks-baselines"
          for item in \
            'v0.4.118-notification-widget-verified|NavTasks_Reliability_0.4.118_Beta_Update.zip|143' \
            'v0.4.140-personal-search-fix-verified|NavTasks_Personal_Search_Fix_0.4.140_Beta_Update.zip|165'; do
            IFS='|' read -r TAG ZIP CODE <<< "$item"
            DIR="$RUNNER_TEMP/navtasks-baselines/$CODE"
            mkdir -p "$DIR"
            gh release download "$TAG" --pattern "$ZIP" --repo "$GITHUB_REPOSITORY" --dir "$DIR"
            test -s "$DIR/$ZIP"
            test "$(unzip -Z1 "$DIR/$ZIP" | grep -Ec '\.apk$')" -eq 1
            ENTRY="$(unzip -Z1 "$DIR/$ZIP" | grep -E '\.apk$')"
            unzip -p "$DIR/$ZIP" "$ENTRY" > "$DIR/baseline.apk"
            "$AAPT" dump badging "$DIR/baseline.apk" | grep -F "package: name='com.navtasks.app.glass' versionCode='$CODE'"
            "$SIGNER" verify --min-sdk-version 31 "$DIR/baseline.apk"
            test "$CURRENT_CERT" = "$(cert_digest "$DIR/baseline.apk")"
            test 175 -gt "$CODE"
          done
          mkdir -p dist
          cp "$APK" dist/NavTasks_0.4.150_RC7_Fix1_WeakNet_Private.apk
          (cd dist && sha256sum NavTasks_0.4.150_RC7_Fix1_WeakNet_Private.apk > NavTasks_0.4.150_RC7_Fix1_WeakNet_Private.apk.sha256)
          (cd dist && sha256sum -c NavTasks_0.4.150_RC7_Fix1_WeakNet_Private.apk.sha256)
          echo "CI verified the APK is signed; physical in-app installation remains untested."
      - name: Delete temporary signing key
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/navtasks-beta-sign.p12"
      - name: Publish only PRIVATE draft RC; NEVER advertise as stable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG='v0.4.150-rc7-fix1-code175-private'
          SOURCE="$(gh api "repos/$GITHUB_REPOSITORY/branches/feature/navtasks-updater-0.4.150-rc7-fix1-code175" --jq '.commit.sha')"
          if [ "$SOURCE" != "$GITHUB_SHA" ]; then
            echo "::error::Outdated run must not publish"
            exit 1
          fi
          DRAFT_ID="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(.tag_name == "v0.4.150-rc7-fix1-code175-private" and .draft == true) | .id')"
          if [ -n "$DRAFT_ID" ]; then
            echo "Existing private draft $DRAFT_ID remains untouched"
          else
            gh release create "$TAG" \
              dist/NavTasks_0.4.150_RC7_Fix1_WeakNet_Private.apk \
              dist/NavTasks_0.4.150_RC7_Fix1_WeakNet_Private.apk.sha256 \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "NavTasks 0.4.150 RC7 Fix1 · in-app installer PRIVATE QA" \
              --notes "PRIVATE DRAFT RC7 Fix1/code175; never stable update feed. Exact RC7/code174 feature base, test channel code176 remains compatible. Same installed package and signing cert as older Betas. Optional updater includes download progress, SHA+installed signing certificate checks, explicit installer action and unknown-source permission handling. Public stable channel remains available:false. CI only; test channel remains manual-only and publicly published as a separate test prerelease; HONOR testing pending. Never uninstall/clear data. Exact RC7 code177 signed recovery already exists. Never uninstall; no public stable changes." \
              --draft --prerelease
          fi
