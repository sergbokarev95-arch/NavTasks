name: Publish APPROVED stable NavTasks APK to public updates (manual only)

on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: "Approved NON-draft, NON-prerelease tag in PRIVATE source repo (vX.Y.Z)"
        required: true
        type: string
      min_supported_version_code:
        description: "OLDEST code tested end-to-end for direct migration to this release"
        required: true
        type: string
      notes_ru:
        description: "Russian release notes"
        required: true
        type: string
      notes_en:
        description: "English release notes"
        required: true
        type: string
      confirmation:
        description: "Type PUBLISH_APPROVED_STABLE after device/migration approval"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: navtasks-manual-public-stable-publication
  cancel-in-progress: false

jobs:
  publish:
    # Deliberately cannot run on a feature branch or for an unapproved build.
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'PUBLISH_APPROVED_STABLE'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: stable-updates
    env:
      SOURCE_TAG: ${{ inputs.source_tag }}
      MIN_SUPPORTED: ${{ inputs.min_supported_version_code }}
      NOTES_RU: ${{ inputs.notes_ru }}
      NOTES_EN: ${{ inputs.notes_en }}
      PRIVATE_REPO: ${{ github.repository }}
      UPDATES_TOKEN: ${{ secrets.NAVTASKS_UPDATES_PUBLISH_TOKEN }}
      PUBLIC_REPO: sergbokarev95-arch/NavTasks-Updates
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android tools for APK verification
        run: sdkmanager --install 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'
      - name: Check manual approval, exclusive publisher credentials and stable tag
        shell: bash
        run: |
          set -euo pipefail
          test -n "$UPDATES_TOKEN" || { echo "::error::Configure NAVTASKS_UPDATES_PUBLISH_TOKEN as a PRIVATE repository Actions secret, scoped ONLY to public NavTasks-Updates"; exit 1; }
          [[ "$SOURCE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo "::error::Stable tag must be vX.Y.Z"; exit 1; }
          [[ "$MIN_SUPPORTED" =~ ^[1-9][0-9]*$ ]] || { echo "::error::A tested minimum supported versionCode is required"; exit 1; }
          test -n "$NOTES_RU"
          test -n "$NOTES_EN"
      - name: Download ONLY approved, stable, signed complete APK from private source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RELEASE_STATE="$(gh release view "$SOURCE_TAG" --repo "$PRIVATE_REPO" --json isDraft,isPrerelease --jq '[.isDraft,.isPrerelease] | @tsv')"
          if [[ "$RELEASE_STATE" != "$(printf 'false\tfalse')" ]]; then
            echo "::error::Source must be a PUBLISHED stable GitHub Release (not draft, RC, beta or recovery)"
            exit 1
          fi
          VERSION="$(printf '%s' "$SOURCE_TAG" | sed 's/^v//')"
          APK_NAME="NavTasks_$VERSION.apk"
          mkdir -p dist
          gh release download "$SOURCE_TAG" --repo "$PRIVATE_REPO" --pattern "$APK_NAME" --dir dist
          test -s "dist/$APK_NAME"
          printf '%s\n' "$NOTES_RU" > dist/notes.ru.txt
          printf '%s\n' "$NOTES_EN" > dist/notes.en.txt
          printf '## Что нового\n\n%s\n\n## Changes\n\n%s\n' "$NOTES_RU" "$NOTES_EN" > dist/release-notes.md
      - name: Verify APK package, versionCode, installed signer and supported Android SDK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(printf '%s' "$SOURCE_TAG" | sed 's/^v//')"
          APK_NAME="NavTasks_$VERSION.apk"
          APK="dist/$APK_NAME"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          SIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          PACKAGE_LINE="$("$AAPT" dump badging "$APK" | grep '^package: ')"
          CODE="$(printf '%s\n' "$PACKAGE_LINE" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p")"
          test -n "$CODE"
          printf '%s\n' "$PACKAGE_LINE" | grep -F "name='com.navtasks.app.glass'"
          printf '%s\n' "$PACKAGE_LINE" | grep -F "versionName='$VERSION'"
          test "$CODE" -gt 168 || { echo "::error::Must exceed emergency recovery versionCode168"; exit 1; }
          test "$MIN_SUPPORTED" -le "$CODE"
          "$AAPT" dump badging "$APK" | grep -F "sdkVersion:'31'"
          if "$AAPT" dump badging "$APK" | grep -Fq 'application-debuggable'; then
            echo "::error::Stable APK may not be debuggable"
            exit 1
          fi
          "$SIGNER" verify --min-sdk-version 31 "$APK"
          cert_digest() {
            "$SIGNER" verify --print-certs "$1" | awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {print $2; exit}'
          }
          CERT="$(cert_digest "$APK")"
          test -n "$CERT"
          # Independent signer anchor: an existing historic signed Beta package.
          TAG='v0.4.140-personal-search-fix-verified'
          BASEZIP='NavTasks_Personal_Search_Fix_0.4.140_Beta_Update.zip'
          mkdir -p baselines
          gh release download "$TAG" --repo "$PRIVATE_REPO" --pattern "$BASEZIP" --dir baselines
          test "$(unzip -Z1 "baselines/$BASEZIP" | grep -Ec '\.apk$')" -eq 1
          ZIP_ENTRY="$(unzip -Z1 "baselines/$BASEZIP" | grep -E '\.apk$')"
          unzip -p "baselines/$BASEZIP" "$ZIP_ENTRY" > baselines/historic.apk
          "$SIGNER" verify --min-sdk-version 31 baselines/historic.apk
          test "$CERT" = "$(cert_digest baselines/historic.apk)" || { echo "::error::Signing certificate mismatch"; exit 1; }
          echo "VERIFIED_CODE=$CODE" >> "$GITHUB_ENV"
          echo "VERIFIED_CERT=$CERT" >> "$GITHUB_ENV"
          (cd dist && sha256sum "$APK_NAME" > "$APK_NAME.sha256")
          (cd dist && sha256sum -c "$APK_NAME.sha256")
      - name: Build stable metadata; compare against LIVE previous public channel
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 'https://raw.githubusercontent.com/sergbokarev95-arch/NavTasks-Updates/main/channels/stable.json' -o dist/previous-stable.json
          VERSION="$(printf '%s' "$SOURCE_TAG" | sed 's/^v//')"
          python3 tools/navtasks_update_feed.py \
            --apk "dist/NavTasks_$VERSION.apk" \
            --version-name "$VERSION" --version-code "$VERIFIED_CODE" \
            --min-supported-version-code "$MIN_SUPPORTED" \
            --signer-sha256 "$VERIFIED_CERT" \
            --notes-ru-file dist/notes.ru.txt --notes-en-file dist/notes.en.txt \
            --previous dist/previous-stable.json --output dist/stable.json
          python3 -m unittest discover -v -s tools/tests -p 'test_navtasks_update_feed.py'
      - name: Publish exact APK and SHA to public GitHub Release before updating channel
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.NAVTASKS_UPDATES_PUBLISH_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="$(printf '%s' "$SOURCE_TAG" | sed 's/^v//')"
          APK_NAME="NavTasks_$VERSION.apk"
          if gh release view "$SOURCE_TAG" --repo "$PUBLIC_REPO" >/dev/null 2>&1; then
            echo "::error::Public release already exists; immutable releases cannot be replaced"
            exit 1
          fi
          gh release create "$SOURCE_TAG" "dist/$APK_NAME" "dist/$APK_NAME.sha256" "dist/stable.json" \
            --repo "$PUBLIC_REPO" --target main \
            --title "NavTasks $VERSION" --notes-file dist/release-notes.md --draft
          ASSETS="$(gh release view "$SOURCE_TAG" --repo "$PUBLIC_REPO" --json assets --jq '.assets[].name')"
          printf '%s\n' "$ASSETS" | grep -Fx "$APK_NAME"
          printf '%s\n' "$ASSETS" | grep -Fx "$APK_NAME.sha256"
          printf '%s\n' "$ASSETS" | grep -Fx "stable.json"
          # Draft remains invisible to anonymous clients until all checks passed.
          gh release edit "$SOURCE_TAG" --repo "$PUBLIC_REPO" --draft=false --prerelease=false
      - name: Publish current/stable.json LAST (safe failure leaves previous channel)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.NAVTASKS_UPDATES_PUBLISH_TOKEN }}
        run: |
          set -euo pipefail
          NEW_SHA="$(gh api "repos/$PUBLIC_REPO/contents/channels/stable.json" --jq '.sha')"
          test -n "$NEW_SHA"
          gh api --method PUT "repos/$PUBLIC_REPO/contents/channels/stable.json" \
            -f message="channels: advertise approved stable $SOURCE_TAG" \
            -f branch=main -f sha="$NEW_SHA" \
            -f content="$(base64 -w0 dist/stable.json)" >/dev/null
          echo "Stable release and the final manifest were published only after APK checks."
