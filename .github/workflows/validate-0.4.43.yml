name: Validate NavTasks 0.4.43 monthly schedule clarity
on:
  push:
    branches: [monthly-schedule-clarity-0.4.43]
    paths: ['.github/workflows/validate-0.4.43.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: sdkmanager --install 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Check unchanged schedule engine and version
        run: |
          set -euo pipefail
          grep -q 'versionName = "0.4.43"' app/build.gradle.kts
          grep -q 'versionCode = 65' app/build.gradle.kts
          grep -q 'monthlySchedulePreview' app/src/main/java/com/navtasks/app/PlanAndTasksUi.kt
      - name: Run unit and monthly recurrence regression tests
        run: gradle :app:testDebugUnitTest --no-daemon
      - name: Compile Compose UI and assemble APK
        run: gradle :app:assembleDebug --no-daemon
