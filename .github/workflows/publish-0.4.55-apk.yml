name: Publish NavTasks Glass 0.4.55 APK
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-0.4.55-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out verified 0.4.55 right-aligned Add controls source
        uses: actions/checkout@v4
        with:
          ref: 401564269c574271b1e3c22c356989fe2d94eb58
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: sdkmanager --install 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Restore stable beta signing key
        env:
          KEYSTORE_B64: ${{ secrets.NAVTASKS_BETA_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$GITHUB_WORKSPACE/navtasks-beta-sign.p12"
          test -s "$GITHUB_WORKSPACE/navtasks-beta-sign.p12"
      - name: Verify source and run regression tests
        env:
          NAVTASKS_BETA_KEYSTORE_PATH: ${{ github.workspace }}/navtasks-beta-sign.p12
          NAVTASKS_BETA_SIGN_PASSWORD: ${{ secrets.NAVTASKS_BETA_SIGN_PASSWORD }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "401564269c574271b1e3c22c356989fe2d94eb58"
          grep -q 'versionName = "0.4.55"' app/build.gradle.kts
          grep -q 'versionCode = 77' app/build.gradle.kts
          if grep -Fq 'Column(Modifier.fillMaxSize().statusBarsPadding().navigationBarsPadding()' \
              app/src/main/java/com/navtasks/app/ServicesUi.kt \
              app/src/main/java/com/navtasks/app/WorkOrdersUi.kt; then
            echo "::error::Standalone work pages must be edge-to-edge"
            exit 1
          fi
          if grep -Fq '.border(if (isToday) 2.dp else 1.dp' app/src/main/java/com/navtasks/app/PlanAndTasksUi.kt; then
            echo "::error::Bright month-cell borders regressed"
            exit 1
          fi
          # The three floating creation controls must be anchored at bottom-right.
          grep -Fq 'Modifier.align(Alignment.BottomEnd).navigationBarsPadding()' app/src/main/java/com/navtasks/app/NavTasksUi.kt
          grep -Fq 'Modifier.align(Alignment.BottomEnd).navigationBarsPadding()' app/src/main/java/com/navtasks/app/ServicesUi.kt
          grep -Fq 'Modifier.align(Alignment.BottomEnd).navigationBarsPadding()' app/src/main/java/com/navtasks/app/WorkOrdersUi.kt
          if grep -Fq 'Modifier.align(Alignment.BottomStart).navigationBarsPadding()' app/src/main/java/com/navtasks/app/ServicesUi.kt app/src/main/java/com/navtasks/app/WorkOrdersUi.kt; then
            echo "::error::Standalone Add controls regressed to left"
            exit 1
          fi
          grep -Fq 'weekend = calendarIsWeekend(day)' app/src/main/java/com/navtasks/app/NavTasksUi.kt
          grep -Fq 'calendarWeekendInk(p)' app/src/main/java/com/navtasks/app/NavTasksUi.kt
          if grep -Eq '<Space([[:space:]]|>)' app/src/main/res/layout/navtasks_widget_*.xml; then
            echo "::error::Unsupported Space in RemoteViews layout"
            exit 1
          fi
          gradle :app:testDebugUnitTest --no-daemon
      - name: Build stable-signed debug APK
        env:
          NAVTASKS_BETA_KEYSTORE_PATH: ${{ github.workspace }}/navtasks-beta-sign.p12
          NAVTASKS_BETA_SIGN_PASSWORD: ${{ secrets.NAVTASKS_BETA_SIGN_PASSWORD }}
        run: gradle :app:assembleDebug --no-daemon
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/navtasks-beta-sign.p12"
      - name: Package compact ZIP directly from build
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          mkdir -p upload
          cp app/build/outputs/apk/debug/app-debug.apk upload/NavTasks_Glass_0.4.55_Beta.apk
          sha256sum upload/NavTasks_Glass_0.4.55_Beta.apk
          cd upload
          zip -q NavTasks_Glass_0.4.55_Build.zip NavTasks_Glass_0.4.55_Beta.apk
          unzip -t NavTasks_Glass_0.4.55_Build.zip
          cd ..
      - name: Publish 0.4.55 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v0.4.55-glass-beta \
            upload/NavTasks_Glass_0.4.55_Beta.apk \
            upload/NavTasks_Glass_0.4.55_Build.zip \
            --repo "${{ github.repository }}" \
            --target 401564269c574271b1e3c22c356989fe2d94eb58 \
            --prerelease \
            --title "NavTasks Glass 0.4.55 Beta · Right-Aligned Add Buttons" \
            --notes "NavTasks 0.4.55: moved the floating Add (+) controls to the right edge on Tasks, Services and AMOS for consistent one-handed layout. Preserved size, existing glass presentation, horizontal 19dp edge inset, original vertical offsets and system navigation safe area. The Today calendar shortcut stays where it was, on the right. No changes to task creation actions, screen content, schedule, data, profiles, notifications, widgets or AMOS logic. Immutable source pinned to 401564269c574271b1e3c22c356989fe2d94eb58, retested with GitHub Actions and built with existing stable Beta signing key. HONOR visual verification remains pending."
