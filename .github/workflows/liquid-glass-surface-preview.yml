name: NavTasks Liquid Glass Surface Preview - isolated
on:
  push:
    branches: [feature/liquid-glass-surface-preview]
    paths:
      - 'app/**'
      - '.github/workflows/liquid-glass-surface-preview.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: sdkmanager --install 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Restore Beta signing key for separately installed app
        env:
          KEYSTORE_B64: ${{ secrets.NAVTASKS_BETA_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$GITHUB_WORKSPACE/navtasks-beta-sign.p12"
          test -s "$GITHUB_WORKSPACE/navtasks-beta-sign.p12"
      - name: Confirm isolated package, intact optical dock and solid-card tokens; test
        env:
          NAVTASKS_BETA_KEYSTORE_PATH: ${{ github.workspace }}/navtasks-beta-sign.p12
          NAVTASKS_BETA_SIGN_PASSWORD: ${{ secrets.NAVTASKS_BETA_SIGN_PASSWORD }}
        run: |
          set -euo pipefail
          grep -Fq 'applicationIdSuffix = ".glasssurface"' app/build.gradle.kts
          grep -Fq 'versionNameSuffix = "-surface-preview1"' app/build.gradle.kts
          test "$(git hash-object app/src/main/java/com/navtasks/app/NavTasksUi.kt)" = "27ba2a88a7b9b84583ba8cbe9b9ad1c08fa2d63c"
          test "$(git hash-object app/src/main/java/com/navtasks/app/NavLiquidGlassDock.kt)" = "77079f53d7f86ea736c8acbb5e2d326d7ad34525"
          test "$(git hash-object app/src/main/java/com/navtasks/app/NavLiquidDockOptics.kt)" = "b63f59048d3798f04f4b722c5e862de4814a42ec"
          grep -Fq 'navSolidCardTokens(p, role)' app/src/main/java/com/navtasks/app/NavGlass.kt
          grep -Fq 'GlassRole.NAVIGATION, GlassRole.SELECTED -> return null' app/src/main/java/com/navtasks/app/NavSolidCardTokens.kt
          gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon
      - name: Remove temporary key
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/navtasks-beta-sign.p12"
      - name: Verify package ID and pack signed APK as a compact ZIP
        run: |
          set -euo pipefail
          APK=NavTasks_LiquidGlass_Surfaces_Preview1.apk
          ZIP=NavTasks_LiquidGlass_Surfaces_Preview1.zip
          test -s app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | grep -F "package: name='com.navtasks.app.glasssurface'"
          cp app/build/outputs/apk/debug/app-debug.apk "$APK"
          zip -9 -X "$ZIP" "$APK"
          unzip -t "$ZIP"
          test "$(sha256sum "$APK" | cut -d ' ' -f 1)" = "$(unzip -p "$ZIP" "$APK" | sha256sum | cut -d ' ' -f 1)"
          echo "APK bytes: $(stat -c %s "$APK")"
          echo "ZIP bytes: $(stat -c %s "$ZIP")"
          sha256sum "$ZIP"
      - uses: actions/upload-artifact@v4
        with:
          name: NavTasks-LiquidGlass-Surfaces-Preview1
          path: NavTasks_LiquidGlass_Surfaces_Preview1.zip
          if-no-files-found: error
          retention-days: 60
      - name: Publish diagnostic prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=glasssurfaces-preview1
          ZIP=NavTasks_LiquidGlass_Surfaces_Preview1.zip
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ZIP" --clobber
          else
            gh release create "$TAG" "$ZIP" --target "$GITHUB_SHA" \
              --title "NavTasks Liquid Glass - solid gradient card surfaces preview" \
              --notes "SEPARATE PREVIEW APP com.navtasks.app.glasssurface, not an update to installed NavTasks. Unified opaque HIG-inspired gradients and brighter edges for PANEL/TASK/NESTED_TASK/CONTROL via shared navGlass material: across Today, Works/AMOS, Services, Handover, Plan, Templates, Profiles and other static panels. DOCK and optical renderer exactly unchanged from 0.4.60, as are navigation/data/notification logic and existing component geometry. NAVIGATION and SELECTED transparency retained. Dark and Light variants. ZIP contains the original signed APK, unpack then install. Preview uses separate local profiles; import a COPY of the full profile only if needed for testing. Check card contrast, edge refraction, and small button legibility before accepting." \
              --prerelease
          fi
