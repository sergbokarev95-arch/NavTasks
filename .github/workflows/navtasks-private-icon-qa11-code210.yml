name: PRIVATE NavTasks 0.4.185 QA11 ICON (DO NOT PUBLISH)
on:
  push:
    branches:
      - feature/navtasks-qa11-icon-code210
    paths:
      - 'app/**'
      - '.github/workflows/navtasks-private-icon-qa11-code210.yml'
  workflow_dispatch:

concurrency:
  group: navtasks-private-icon-qa11-code210-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  signed-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: sdkmanager --install 'platforms;android-36' 'platforms;android-36-ext19' 'build-tools;35.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Restore ORIGINAL NavTasks signing key (never generate another)
        env:
          KEYSTORE_B64: ${{ secrets.NAVTASKS_BETA_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$GITHUB_WORKSPACE/navtasks-beta-sign.p12"
          chmod 600 "$GITHUB_WORKSPACE/navtasks-beta-sign.p12"
          test -s "$GITHUB_WORKSPACE/navtasks-beta-sign.p12"
      - name: Build pre1.0 QA only (PRIVATE, NO PUBLISH)
        env:
          NAVTASKS_BETA_KEYSTORE_PATH: ${{ github.workspace }}/navtasks-beta-sign.p12
          NAVTASKS_BETA_SIGN_PASSWORD: ${{ secrets.NAVTASKS_BETA_SIGN_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$NAVTASKS_BETA_SIGN_PASSWORD"
          gradle :app:testDebugUnitTest :app:assembleRelease --no-daemon
      - name: Verify QA identity, version and historic signature
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.navtasks.app.glass' versionCode='210' versionName='0.4.185-qa11'"
          ! "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -Fq 'application-debuggable'
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --min-sdk-version 31 "$APK"
          ACTUAL="$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {print $2; exit}')"
          test "$ACTUAL" = 0cb8a3c691e3fb2198682dff8c226aec710e77c7b8fded7d260a92f359a49c54
      - name: Export foreground-only HONOR MagicOS Liquid Glass icon
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet cairosvg pillow
          python3 tools/icon_artwork/export_magic_glass.py app/src/main/res/drawable/navtasks_icon_foreground.xml "$RUNNER_TEMP/com.navtasks.app.glass.png" --size 512
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          import os
          d = Path(os.environ['RUNNER_TEMP'])
          p = d / 'com.navtasks.app.glass.png'
          assert p.stat().st_size > 1000
          with ZipFile(d / 'NavTasks_MagicOS_LiquidGlass_Icon_Overlay.zip', 'w', ZIP_DEFLATED) as z:
              z.write(p, p.name)
              z.writestr('README.txt', 'NOT a standalone HONOR theme. Merge this PNG into your existing icons.zip, preserve all other theme resources. A normal APK cannot switch icon backgrounds depending on the launcher theme.')
          PY
      - name: Save verified QA APK as PRIVATE DRAFT release (not latest, not stable)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/NavTasks-0.4.185-qa11-code210.apk"
          gh release create "navtasks-private-icon-qa11-code210" \
            "$RUNNER_TEMP/NavTasks-0.4.185-qa11-code210.apk" \
            "$RUNNER_TEMP/com.navtasks.app.glass.png" \
            "$RUNNER_TEMP/NavTasks_MagicOS_LiquidGlass_Icon_Overlay.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --draft --latest=false \
            --target "$GITHUB_SHA" \
            --title "PRIVATE NavTasks 0.4.185 QA11 ICON (DO NOT PUBLISH)" \
            --notes "Private QA10 tests upstream Compose Rich Editor v1.0.0 fix for Android drag selection handles, upstream PR #746/#748. No editor model, note HTML, profiles or task business rules rewritten. User should export full profile and .navlib and download exact QA9 source code209 recovery before installing in-place. Physically verify dragging selection across multi-line ECDIS text and old formatted HTML; no stable release."
      - name: Erase temporary signing key
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/navtasks-beta-sign.p12"
