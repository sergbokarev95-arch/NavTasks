name: Publish NavTasks Glass 0.4.47 APK
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-0.4.47-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out verified 0.4.47 notification and missed/widget source
        uses: actions/checkout@v4
        with:
          ref: c781c184c668be248e2aef979940d81ee3364ab9
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: sdkmanager --install 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Restore stable beta signing key
        env:
          KEYSTORE_B64: ${{ secrets.NAVTASKS_BETA_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$GITHUB_WORKSPACE/navtasks-beta-sign.p12"
          test -s "$GITHUB_WORKSPACE/navtasks-beta-sign.p12"
      - name: Verify source and run regression tests
        env:
          NAVTASKS_BETA_KEYSTORE_PATH: ${{ github.workspace }}/navtasks-beta-sign.p12
          NAVTASKS_BETA_SIGN_PASSWORD: ${{ secrets.NAVTASKS_BETA_SIGN_PASSWORD }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "c781c184c668be248e2aef979940d81ee3364ab9"
          grep -q 'versionName = "0.4.47"' app/build.gradle.kts
          grep -q 'versionCode = 69' app/build.gradle.kts
          gradle :app:testDebugUnitTest --no-daemon
      - name: Build stable-signed debug APK
        env:
          NAVTASKS_BETA_KEYSTORE_PATH: ${{ github.workspace }}/navtasks-beta-sign.p12
          NAVTASKS_BETA_SIGN_PASSWORD: ${{ secrets.NAVTASKS_BETA_SIGN_PASSWORD }}
        run: gradle :app:assembleDebug --no-daemon
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/navtasks-beta-sign.p12"
      - name: Package compact ZIP directly from build
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          mkdir -p upload
          cp app/build/outputs/apk/debug/app-debug.apk upload/NavTasks_Glass_0.4.47_Beta.apk
          sha256sum upload/NavTasks_Glass_0.4.47_Beta.apk
          cd upload
          zip -q NavTasks_Glass_0.4.47_Build.zip NavTasks_Glass_0.4.47_Beta.apk
          unzip -t NavTasks_Glass_0.4.47_Build.zip
          cd ..
      - name: Publish 0.4.47 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v0.4.47-glass-beta \
            upload/NavTasks_Glass_0.4.47_Beta.apk \
            upload/NavTasks_Glass_0.4.47_Build.zip \
            --repo "${{ github.repository }}" \
            --target c781c184c668be248e2aef979940d81ee3364ab9 \
            --prerelease \
            --title "NavTasks Glass 0.4.47 Beta · Notifications and Missed Widgets" \
            --notes "NavTasks 0.4.47: notification cards carry the installed full-color launcher icon; the monochrome small icon depicts original layered-card branding rather than a lone checkmark. Today missed backlog is subtly red only when nonzero; home widget shows date/progress, compact pending tasks and a red Missed button leading to the backlog. Wide layout uses two columns only when >=350dp to avoid clipped titles. Existing simple-task completion and checklist tap semantics, AMOS/Services due dates, profiles, recurrence and all data structures remain unchanged. Unit tests and signed build verified in main CI 42331470504. HONOR/Samsung on-device icon placement and widget layout still require user visual validation."
