name: Publish NavTasks Glass 0.4.50 APK
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-0.4.50-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out verified 0.4.50 planned/unplanned maintenance source
        uses: actions/checkout@v4
        with:
          ref: 0a3467be369d889774b653d111917d7a6606a520
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: sdkmanager --install 'platforms;android-36' 'build-tools;35.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Restore stable beta signing key
        env:
          KEYSTORE_B64: ${{ secrets.NAVTASKS_BETA_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$GITHUB_WORKSPACE/navtasks-beta-sign.p12"
          test -s "$GITHUB_WORKSPACE/navtasks-beta-sign.p12"
      - name: Verify source and run regression tests
        env:
          NAVTASKS_BETA_KEYSTORE_PATH: ${{ github.workspace }}/navtasks-beta-sign.p12
          NAVTASKS_BETA_SIGN_PASSWORD: ${{ secrets.NAVTASKS_BETA_SIGN_PASSWORD }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "0a3467be369d889774b653d111917d7a6606a520"
          grep -q 'versionName = "0.4.50"' app/build.gradle.kts
          grep -q 'versionCode = 72' app/build.gradle.kts
          if grep -Eq '<Space([[:space:]]|>)' app/src/main/res/layout/navtasks_widget_*.xml; then
            echo "::error::Unsupported Space in RemoteViews layout"
            exit 1
          fi
          gradle :app:testDebugUnitTest --no-daemon
      - name: Build stable-signed debug APK
        env:
          NAVTASKS_BETA_KEYSTORE_PATH: ${{ github.workspace }}/navtasks-beta-sign.p12
          NAVTASKS_BETA_SIGN_PASSWORD: ${{ secrets.NAVTASKS_BETA_SIGN_PASSWORD }}
        run: gradle :app:assembleDebug --no-daemon
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/navtasks-beta-sign.p12"
      - name: Package compact ZIP directly from build
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          mkdir -p upload
          cp app/build/outputs/apk/debug/app-debug.apk upload/NavTasks_Glass_0.4.50_Beta.apk
          sha256sum upload/NavTasks_Glass_0.4.50_Beta.apk
          cd upload
          zip -q NavTasks_Glass_0.4.50_Build.zip NavTasks_Glass_0.4.50_Beta.apk
          unzip -t NavTasks_Glass_0.4.50_Build.zip
          cd ..
      - name: Publish 0.4.50 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v0.4.50-glass-beta \
            upload/NavTasks_Glass_0.4.50_Beta.apk \
            upload/NavTasks_Glass_0.4.50_Build.zip \
            --repo "${{ github.repository }}" \
            --target 0a3467be369d889774b653d111917d7a6606a520 \
            --prerelease \
            --title "NavTasks Glass 0.4.50 Beta · Planned and Unplanned Services" \
            --notes "NavTasks 0.4.50 introduces Planned / Unplanned equipment services. Unplanned work is recorded with an AMOS requisition number at creation, no fabricated due date, recurrence or service reminders. Planned services and historical profile data retain their scheduling and completion behavior. Unplanned completion archives its requisition without creating a future cycle; Calendar, Today due list and Soon/Overdue never include it based on invented dates. The user's existing profiles, template exchange, scheduled AMOS work, tasks, notifications and widgets remain intact. Immutable source 0a3467be369d889774b653d111917d7a6606a520; signed build and regression tests repeated by this workflow. Device verification on HONOR still needed."
