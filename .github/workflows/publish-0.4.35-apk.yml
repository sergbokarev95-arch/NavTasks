name: Publish NavTasks Glass 0.4.35 APK
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-0.4.35-apk.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify tested source and download signed APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN=42062243451
          REPO="${{ github.repository }}"
          EXPECTED_SHA="aedf3dea82a8bc924b7508bedffb44860943e6c7"
          test "$(gh run view "$RUN" --repo "$REPO" --json conclusion --jq .conclusion)" = success
          test "$(gh run view "$RUN" --repo "$REPO" --json headSha --jq .headSha)" = "$EXPECTED_SHA"
          mkdir -p upload
          gh run download "$RUN" --repo "$REPO" \
            --name NavTasks-Glass-0.2.6-debug-apk --dir upload
          test -s upload/app-debug.apk
          sha256sum upload/app-debug.apk
          mv upload/app-debug.apk upload/NavTasks_Glass_0.4.35_Beta.apk
          cd upload
          zip -q NavTasks_Glass_0.4.35_Build.zip NavTasks_Glass_0.4.35_Beta.apk
          unzip -t NavTasks_Glass_0.4.35_Build.zip
          cd ..

      - name: Publish version 0.4.35
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v0.4.35-glass-beta \
            upload/NavTasks_Glass_0.4.35_Beta.apk \
            upload/NavTasks_Glass_0.4.35_Build.zip \
            --repo "${{ github.repository }}" \
            --target aedf3dea82a8bc924b7508bedffb44860943e6c7 \
            --prerelease \
            --title "NavTasks Glass 0.4.35 Beta · Inspections Placeholder" \
            --notes "Only the inactive Works hub placeholder was renamed from Other work to Inspections (RU/EN), with VIQ7 / SIRE 2.0 listed as future reference and checklist content. AMOS, maintenance, tasks, navigation and storage logic remain unchanged. versionCode 57, versionName 0.4.35. Unit tests, signed debug APK build and artifact upload passed in GitHub Actions run 42062243451. No device test is claimed."
