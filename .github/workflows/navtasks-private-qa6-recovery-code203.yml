name: PRIVATE NavTasks 0.4.178 code203 EXACT QA6 RECOVERY (DO NOT PUBLISH)
on:
  push:
    branches:
      - qa/navtasks-qa6-recovery-code203
    paths:
      - 'app/**'
      - '.github/workflows/navtasks-private-qa6-recovery-code203.yml'
  workflow_dispatch:

concurrency:
  group: navtasks-private-qa6-recovery-code203-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  signed-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK
        run: sdkmanager --install 'platforms;android-36' 'platforms;android-36-ext19' 'build-tools;35.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Restore ORIGINAL NavTasks signing key (never generate another)
        env:
          KEYSTORE_B64: ${{ secrets.NAVTASKS_BETA_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$GITHUB_WORKSPACE/navtasks-beta-sign.p12"
          chmod 600 "$GITHUB_WORKSPACE/navtasks-beta-sign.p12"
          test -s "$GITHUB_WORKSPACE/navtasks-beta-sign.p12"
      - name: Build pre1.0 QA only (PRIVATE, NO PUBLISH)
        env:
          NAVTASKS_BETA_KEYSTORE_PATH: ${{ github.workspace }}/navtasks-beta-sign.p12
          NAVTASKS_BETA_SIGN_PASSWORD: ${{ secrets.NAVTASKS_BETA_SIGN_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$NAVTASKS_BETA_SIGN_PASSWORD"
          gradle :app:testDebugUnitTest :app:assembleRelease --no-daemon
      - name: Verify QA identity, version and historic signature
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='com.navtasks.app.glass' versionCode='203' versionName='0.4.178-qa6-recovery'"
          ! "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -Fq 'application-debuggable'
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --min-sdk-version 31 "$APK"
          ACTUAL="$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK" | awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {print $2; exit}')"
          test "$ACTUAL" = 0cb8a3c691e3fb2198682dff8c226aec710e77c7b8fded7d260a92f359a49c54
      - name: Save verified QA APK as PRIVATE DRAFT release (not latest, not stable)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/NavTasks-0.4.178-qa6-recovery-code203.apk"
          gh release create "navtasks-private-continuous-pdf-qa6-code200" \
            "$RUNNER_TEMP/NavTasks-0.4.178-qa6-recovery-code203.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --draft --latest=false \
            --target "$GITHUB_SHA" \
            --title "PRIVATE NavTasks 0.4.178 code203 EXACT QA6 RECOVERY (DO NOT PUBLISH)" \
            --notes "Emergency recovery only: exact HONOR-accepted QA6 code200 application source with versionCode203. Preserves working continuous PDF, external chooser, widgets, all profiles, notes, AMOS, Services and business logic. Download before installing QA7 code202; do not install unless regression, never uninstall or wipe. Stable feed stays disabled."
      - name: Erase temporary signing key
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/navtasks-beta-sign.p12"
